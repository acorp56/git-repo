<title>Кровинка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECEAE7;--surface:#FFFFFF;--chip:#F3F1EE;--ink:#111111;--muted:#8A8783;--line:#E6E3DF;
  --accent:#E3232F;--accent-ink:#FFFFFF;--accent-soft:#FCE3E3;
  --lilac:#CBC4FF;--on-lilac:#16112B;--sun:#FFCB45;--mint:#AEE8CC;
  --ok:#17845A;--ok-soft:#DDF3E7;--warn:#8A5200;--warn-soft:#FFE7BE;
  --tg:#2AABEE;
  --shadow:0 10px 30px rgba(17,17,17,.08),0 2px 6px rgba(17,17,17,.05);
  --glass:rgba(255,255,255,.52);--glass-edge:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.9);--lens:rgba(255,255,255,.9);--glass-shadow:0 12px 34px rgba(17,17,17,.14),0 2px 8px rgba(17,17,17,.06);
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B0B0B;--surface:#171717;--chip:#232323;--ink:#F4F2EF;--muted:#8F8C88;--line:#2A2A2A;
  --accent:#FF3B45;--accent-ink:#FFFFFF;--accent-soft:#3A1417;
  --lilac:#B6ADFF;--on-lilac:#120E24;--sun:#FFCB45;--mint:#8FDDB8;
  --ok:#4CCB8E;--ok-soft:#10291E;--warn:#F0A63A;--warn-soft:#33250D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --glass:rgba(40,40,40,.5);--glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.16);--lens:rgba(255,255,255,.16);--glass-shadow:0 12px 34px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0B;--surface:#171717;--chip:#232323;--ink:#F4F2EF;--muted:#8F8C88;--line:#2A2A2A;
  --accent:#FF3B45;--accent-ink:#FFFFFF;--accent-soft:#3A1417;
  --lilac:#B6ADFF;--on-lilac:#120E24;--sun:#FFCB45;--mint:#8FDDB8;
  --ok:#4CCB8E;--ok-soft:#10291E;--warn:#F0A63A;--warn-soft:#33250D;
  --shadow:0 10px 30px rgba(0,0,0,.5);
  --glass:rgba(40,40,40,.5);--glass-edge:rgba(255,255,255,.14);--glass-hi:rgba(255,255,255,.16);--lens:rgba(255,255,255,.16);--glass-shadow:0 12px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:500px;margin:0 auto;padding-inline:16px;padding-block:0 132px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:16px 12px}
.brand{display:flex;align-items:center;gap:9px}
.drop{width:14px;height:14px;background:var(--accent);border-radius:50% 50% 50% 0;transform:rotate(-45deg);flex:none}
.brand b{font-weight:700;font-size:21px;letter-spacing:-.05em;text-transform:lowercase}
.city{background:var(--surface);border:0;border-radius:999px;padding:10px 13px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;white-space:nowrap;min-width:0;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.demo{background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;padding:6px 11px;border-radius:999px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h2{font-size:22px;line-height:1.15;letter-spacing:-.035em}
.lt{font-weight:300;color:var(--muted)}
.page-title{font-size:40px;line-height:1.02;letter-spacing:-.05em;margin:14px 0 4px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-inline:4px}
.eyebrow{font-size:14px;font-weight:500;color:var(--muted);margin:0}
.link{background:var(--surface);border:0;border-radius:999px;padding:8px 14px;color:var(--ink);font-weight:600;font-size:13.5px;white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:0;border-radius:26px;padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}
.icon-btn{background:var(--surface);border:0;width:42px;height:42px;display:grid;place-items:center;position:relative;flex:none;border-radius:50%}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);font-size:0;border:2px solid var(--surface)}
.rbtn{width:46px;height:46px;border-radius:50%;background:var(--chip);border:0;display:grid;place-items:center;font-size:18px;font-weight:500;flex:none}

/* hero */
.hero{background:#C5121F;color:#fff;border-radius:32px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden;isolation:isolate}
.hero>*:not(.hero-fx){position:relative;z-index:2}
.hero-fx{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.hero-fx .blob{position:absolute;border-radius:50%;filter:blur(38px);mix-blend-mode:screen;opacity:.85;will-change:transform}
.hero-fx .b1{width:70%;height:55%;left:-18%;top:-12%;background:radial-gradient(circle at 40% 40%,#FF5A4E,#FF2B3A 55%,transparent 72%);animation:drift1 14s ease-in-out infinite alternate}
.hero-fx .b2{width:65%;height:60%;right:-22%;top:8%;background:radial-gradient(circle at 50% 50%,#FF3D7F,#E0115F 50%,transparent 72%);animation:drift2 17s ease-in-out infinite alternate;opacity:.7}
.hero-fx .b3{width:80%;height:55%;left:10%;top:38%;background:radial-gradient(circle at 50% 50%,#7A0716,#5A0410 55%,transparent 75%);mix-blend-mode:multiply;opacity:.75;animation:drift3 19s ease-in-out infinite alternate}
.hero-fx .b4{width:45%;height:35%;right:4%;top:-8%;background:radial-gradient(circle,#FFB199,transparent 70%);opacity:.45;animation:drift2 11s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(28%,22%) scale(1.15)}}
@keyframes drift2{to{transform:translate(-30%,18%) scale(.9)}}
@keyframes drift3{to{transform:translate(-14%,-16%) scale(1.2)}}
.hero .tags span{box-shadow:0 6px 16px rgba(60,0,8,.35)}
.hero .sos-btn{box-shadow:0 12px 26px rgba(50,0,6,.45)}
.hero .eyebrow{color:rgba(255,255,255,.8)}
.hero h1{font-size:clamp(38px,10.5vw,50px);line-height:1;letter-spacing:-.055em;position:relative}
.hero h1 .lt{color:rgba(255,255,255,.72)}
.lead{font-size:16px;line-height:1.45;color:rgba(255,255,255,.88);margin:0;max-width:32ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding-block:4px}
.tags span{background:#111;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;transform:rotate(var(--r,0deg));white-space:nowrap}
.sos-btn{display:flex;align-items:center;gap:14px;width:100%;background:#111;color:#fff;border:0;border-radius:999px;padding:7px 22px 7px 7px;font-weight:600;font-size:17px;text-align:left}
.sos-btn .ic{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.sos-btn .ic i{width:16px;height:16px;background:#E3232F;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.sos-btn .arrow{margin-left:auto;font-size:20px;font-weight:400}
.nearby{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:26px;padding:18px 18px 16px}
.stat:first-child{background:var(--ink);color:var(--bg)}
.stat .v{font-size:56px;font-weight:300;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--muted);margin-top:10px}
.stat:first-child .l{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trio>div{background:var(--surface);border-radius:22px;padding:16px 10px;text-align:center}
.trio .v{font-size:30px;font-weight:600;letter-spacing:-.05em;line-height:1.1;font-variant-numeric:tabular-nums}
.trio .v.red{color:var(--accent)}
.trio .l{font-size:12.5px;color:var(--muted);margin-top:4px}

/* requests */
.req{background:var(--surface);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:14px}
.req-head{display:flex;gap:14px;align-items:stretch}
.tube{width:70px;border-radius:20px;background:var(--chip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;flex:none;padding:10px 4px;position:relative}
.tube .g{font-size:21px;font-weight:700;color:var(--accent);letter-spacing:-.04em;line-height:1}
.tube .u{font-size:11px;color:var(--muted)}
.tube .vial{width:10px;height:26px;border:1.5px solid var(--muted);border-top:0;border-radius:0 0 6px 6px;position:relative;overflow:hidden;margin-top:4px}
.tube .vial::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--accent)}
.req h3{font-size:19px;letter-spacing:-.03em;line-height:1.2}
.req.urgent h3::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;position:relative;top:-2px}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;flex:none;background:var(--chip);color:var(--ink)}
.meta{font-size:13.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--ink);white-space:nowrap}
.chip.red{background:var(--accent);color:#fff}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gold{background:var(--sun);color:#111}
.blood{font-family:var(--mono);font-weight:500}
.btns{display:flex;gap:8px;align-items:center}
.btn{border:0;background:var(--chip);border-radius:999px;padding:13px 20px;font-weight:600;font-size:15px;line-height:1.2;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--chip)}
.btn.done{background:var(--ok-soft);color:var(--ok)}
.btn.tgb{background:var(--tg);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.wide{width:100%;padding:17px;font-size:16px}
.card .btn:not(.primary):not(.done):not(.tgb){background:var(--chip)}
.btn[disabled]{cursor:default}

/* pet */
.pet-hero{display:flex;gap:16px;align-items:center;padding-inline:4px}
.pet-ava{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:28px;flex:none}
.pet-hero h2{font-size:34px;letter-spacing:-.05em;line-height:1}
.ring{display:flex;gap:16px;align-items:center}
.ring svg{flex:none}
.ring .big{font-size:24px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.checks li:first-child{border-top:0}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;margin-top:1px}
.mark.y{background:var(--ok-soft);color:var(--ok)}.mark.n{background:var(--accent-soft);color:var(--accent)}
.med{display:flex;flex-direction:column}
.med-row{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.med-row:first-child{border-top:0;padding-top:0}
.med-row:last-child{padding-bottom:0}
.med-row .t{flex:1;min-width:0}
.med-row .t b{display:block;font-weight:600;font-size:15px;letter-spacing:-.015em}
.tg{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:26px;padding:16px;flex-wrap:wrap}
.tg .ic{width:44px;height:44px;border-radius:50%;background:var(--tg);display:grid;place-items:center;flex:none}

/* gamification */
.level{background:var(--lilac);color:var(--on-lilac);border:0;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%}
.level .tag{background:rgba(255,255,255,.55);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.level .go{width:38px;height:38px;border-radius:50%;background:var(--on-lilac);color:var(--lilac);display:grid;place-items:center;font-size:17px}
.level .big{display:flex;align-items:baseline;gap:10px}
.level .big .n{font-size:76px;font-weight:300;letter-spacing:-.065em;line-height:.9;font-variant-numeric:tabular-nums}
.level .big .u{font-size:17px;font-weight:600}
.level .sub{font-size:14px;opacity:.7}
.level .bar{background:rgba(22,17,43,.14)}
.level .bar i{background:var(--on-lilac)}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar.ok i{background:var(--ok)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;background:var(--surface);border-radius:22px;padding:16px 8px 14px}
.badge .b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);font-family:var(--mono);font-weight:500;font-size:13px;color:var(--muted)}
.badge.on .b{border:0;background:var(--accent);color:#fff}
.badge.on:nth-child(5n+2) .b{background:var(--ink);color:var(--bg)}
.badge.on:nth-child(5n+3) .b{background:var(--lilac);color:var(--on-lilac)}
.badge.on:nth-child(5n+4) .b{background:var(--sun);color:#111}
.badge.on:nth-child(5n+5) .b{background:var(--mint);color:#0D3A26}
.badge b{font-size:13.5px;font-weight:600;line-height:1.2;letter-spacing:-.02em}
.badge .d{font-size:11.5px;color:var(--muted);line-height:1.3}
.badge .bar{width:70%;height:5px}
.badge .p{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chal{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.chal:first-child{border-top:0;padding-top:0}
.chal:last-child{padding-bottom:0}
.chal .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.lb{display:flex;flex-direction:column}
.lb-row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:0;padding-top:0}
.lb-row .r{font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.lb-row.top .r{width:28px;height:28px;border-radius:50%;background:var(--sun);color:#111;display:grid;place-items:center;font-size:13px}
.lb-row.me{background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:16px;border-top-color:transparent}
.lb-row .v{font-weight:600;font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.celebrate{display:flex;flex-direction:column;align-items:flex-start;gap:16px;background:var(--accent);color:#fff;border-radius:32px;padding:28px 22px;margin-top:8px}
.celebrate .muted{color:rgba(255,255,255,.85)!important}
.celebrate .bigdrop{width:72px;height:72px;background:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center}
.celebrate .bigdrop span{transform:rotate(45deg);font-weight:700;color:#E3232F;font-size:17px;letter-spacing:-.03em}
.celebrate h1{font-size:42px;line-height:1;letter-spacing:-.055em}
.hero-img{width:100%;border-radius:26px;display:block;aspect-ratio:4/5;background:var(--surface)}

/* stories */
.story{display:flex;flex-direction:column;gap:14px}
.story .pair{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap;letter-spacing:-.02em}
.story .pair .ava{width:34px;height:34px;font-size:14px}
.story blockquote{margin:0;font-size:18px;line-height:1.45;letter-spacing:-.02em}
.thanks{background:var(--chip);border:0;border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.thanks.on{background:var(--accent);color:#fff}

/* emergency */
.acc{background:var(--surface);border-radius:22px}
.acc summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.02em}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:400;font-size:18px;flex:none}
.acc[open] summary::after{content:"−";background:var(--ink);color:var(--bg)}
.acc .body{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px;font-size:15px}
.acc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.acc .alarm{background:var(--accent-soft);color:var(--accent);border-radius:16px;padding:11px 14px;font-weight:600;font-size:14px}
.read-tick{font-size:11.5px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:3px 9px;border-radius:99px}
.clinic{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.clinic:first-child{border-top:0;padding-top:0}
.clinic:last-child{padding-bottom:0}
.clinic .t{flex:1;min-width:0}
.open247{font-size:11.5px;font-weight:600;color:#0D3A26;background:var(--mint);padding:3px 9px;border-radius:99px}

/* telegram preview */
.chat{background:var(--surface);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:8px}
.chat .who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-bottom:6px}
.chat .who .ic{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.bubble{background:var(--chip);border-radius:18px 18px 18px 6px;padding:10px 13px;font-size:14.5px;max-width:88%}
.bubble .tm{font-size:11px;color:var(--muted);text-align:right;margin-top:3px}
.switch{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0;padding-top:0}
.switch:last-child{padding-bottom:0}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* forms */
.field{display:flex;flex-direction:column;gap:8px}
.field label,.flabel{font-size:13.5px;font-weight:500;color:var(--muted);padding-inline:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);border-radius:999px;padding:11px 17px;font-weight:600;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:999px;padding:5px;gap:4px}
.tabs button{border:0;background:none;border-radius:999px;padding:11px 8px;font-weight:600;font-size:14.5px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:0;border-radius:18px;padding:15px 16px;appearance:none;-webkit-appearance:none}
.card input,.card select{background:var(--chip)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 17px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:0}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:80px}
.code-in{font-family:var(--mono);font-size:28px!important;letter-spacing:.5em!important;text-align:center}
.match{background:var(--ok-soft);color:var(--ok);border-radius:18px;padding:13px 16px;font-weight:600;font-size:14.5px}
.match.none{background:var(--warn-soft);color:var(--warn)}
.card>.match{margin-bottom:4px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--muted);padding-inline:4px}
.consent input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}

/* responder */
.resp{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.resp:first-child{border-top:0;padding-top:0}
.resp .t{flex:1;min-width:0}
.phone{font-family:var(--mono);font-weight:500;user-select:all}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(468px,calc(100% - 16px));background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--glass-edge);border-radius:999px;box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi);z-index:10}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 55%);pointer-events:none}
.nav-in{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:4px;padding:6px}
.lens{position:absolute;top:6px;left:0;height:56px;width:56px;border-radius:999px;background:var(--lens);box-shadow:inset 0 1px 0 var(--glass-hi),0 4px 14px rgba(0,0,0,.08);opacity:0;transition:transform .5s cubic-bezier(.3,1.35,.5,1),width .5s cubic-bezier(.3,1.35,.5,1),opacity .2s;z-index:0}
.nav button{background:none;border:0;display:grid;place-items:center;height:56px;color:var(--muted);padding:0;transition:color .25s}
.nav button[aria-current="page"]{color:var(--ink)}
.nav .ni{width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.nav button[aria-current="page"] svg{transform:scale(1.06)}
.nav .ni.pop svg{animation:tabPop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabPop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1.06)}}
.nav svg{width:22px;height:22px;stroke-width:1.8;transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.nav .fab span.c{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13.5px;letter-spacing:-.01em;position:relative;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.nav .fab span.c::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);animation:ring 2.8s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.5}70%,100%{transform:scale(1.22);opacity:0}}
.back{background:var(--surface);border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.note{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0;padding-inline:4px}

/* ai */
.ai-card{display:flex;flex-direction:column;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:28px;padding:22px 20px;text-align:left;width:100%;position:relative}
.ai-card .eyebrow{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.ai-card h2{font-size:28px;letter-spacing:-.045em;padding-right:52px}
.ai-card p{margin:0;color:color-mix(in srgb,var(--bg) 72%,transparent);font-size:15px;max-width:34ch}
.ai-card .go{position:absolute;right:18px;top:18px;width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--on-lilac);color:var(--lilac);padding:4px 10px;border-radius:999px;white-space:nowrap}
.ai-card .ai-tag{background:var(--lilac);color:var(--on-lilac);align-self:flex-start}
.chip-btn{border:0;background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500}
.aifill{background:var(--lilac);color:var(--on-lilac);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px}
.aifill textarea{background:rgba(255,255,255,.7);color:#16112B}
.aifill textarea::placeholder{color:#5A5370}
.aifill .btn.primary{background:var(--on-lilac);color:#fff}
.aifill .small{opacity:.78}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin-block:18px 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.verdict{border-radius:32px;padding:24px 22px;display:flex;flex-direction:column;gap:12px;margin-top:18px}
.verdict.urgent{background:var(--accent);color:#fff}
.verdict.today{background:var(--sun);color:#111}
.verdict.watch{background:var(--mint);color:#0D3A26}
.verdict .tag{align-self:flex-start;background:rgba(255,255,255,.3);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.verdict.urgent .tag{background:#111;color:#fff}
.verdict h1{font-size:34px;line-height:1.02;letter-spacing:-.05em}
.verdict p{margin:0;font-size:16px;line-height:1.45}
.think{display:flex;align-items:center;gap:12px;margin-top:18px}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.scan{display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center}
.post{background:var(--chip);border-radius:18px;padding:14px 16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap}

/* donor cta + sheet */
.donor-cta{background:var(--surface);border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.donor-cta h2{font-size:28px;letter-spacing:-.045em;line-height:1.05;padding-right:64px}
.donor-cta .badge-drop{position:absolute;right:20px;top:22px;width:48px;height:48px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent)}
.donor-cta .facts{display:flex;flex-wrap:wrap;gap:6px}
.donor-cta .row .meta{white-space:nowrap}
.sheet-bg{position:fixed;inset:0;background:rgba(10,10,10,.45);z-index:30}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(468px,calc(100% - 24px));background:var(--surface);border-radius:30px;padding:24px 20px 20px;z-index:31;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.sheet h2{font-size:26px;letter-spacing:-.045em;line-height:1.08}
.sheet p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);align-self:center;margin-top:-10px}

@media (max-width:420px){.icon-btn[data-act="theme"]{display:none}.city{max-width:40vw}.brand b{font-size:19px}}
.top>.row{min-width:0}

/* hero pets pill */
.pets{display:inline-block;position:relative;width:2.3em;height:1.04em;vertical-align:-.14em;margin-inline:.04em;animation:pillIn .8s .15s cubic-bezier(.3,1.4,.5,1) both}
.pets svg{width:100%;height:100%;display:block;border-radius:999px}
.pets .pdrop{position:absolute;top:-.16em;right:-.12em;width:.44em;height:.44em;border-radius:50%;background:#111;display:grid;place-items:center;box-shadow:0 0 0 .05em #E3232F;animation:badge 2.4s 1s ease-in-out infinite}
.pets .pdrop::after{content:"";width:.16em;height:.16em;background:#FF3B45;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
@keyframes pillIn{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes badge{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* errors */
.err{outline:2px solid var(--accent)!important;outline-offset:0}
.ferr{color:var(--accent);font-size:13.5px;font-weight:500;padding-inline:4px;display:flex;gap:6px;align-items:flex-start}
.ferr::before{content:"!";width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:1px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.offline{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:9;margin-top:10px;background:color-mix(in srgb,var(--ink) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:var(--bg);border-radius:20px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px;animation:dropIn .35s cubic-bezier(.3,1.3,.5,1)}
.offline .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none;animation:blink 1.4s infinite}
.state{background:var(--surface);border-radius:28px;padding:30px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.state .ill{width:64px;height:64px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:26px;font-weight:300}
.state .ill i{width:22px;height:22px;background:var(--accent);border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.state.bad .ill{background:var(--accent-soft);color:var(--accent);font-weight:700}
.state h2{font-size:26px;letter-spacing:-.045em}
.state p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:36ch}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:18px;padding:13px 16px;font-size:14.5px;font-weight:500}
.demo-err .switch b{font-weight:600}
.skel{height:12px;border-radius:99px;background:linear-gradient(90deg,var(--chip) 25%,var(--line) 50%,var(--chip) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* motion */
.btn,.rbtn,.chip-btn,.seg button,.link,.icon-btn,.city,.sos-btn,.ai-card,.tabs button,.thanks,.back,.level,.acc summary{transition:transform .18s cubic-bezier(.3,1.4,.5,1),background-color .2s,color .2s,opacity .2s}
.btn:active,.rbtn:active,.chip-btn:active,.seg button:active,.link:active,.icon-btn:active,.city:active,.sos-btn:active,.ai-card:active,.tabs button:active,.thanks:active,.back:active,.level:active{transform:scale(.96)}
.sos-btn:active .arrow{transform:translate(3px,-3px)}
.sos-btn .arrow{transition:transform .2s}
.sos-btn .ic i{animation:badge 1.8s ease-in-out infinite}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.enter .bar i{animation:grow 1s .25s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.enter .tube .vial::after{animation:fillup 1s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fillup{from{height:0}}
.thanks.on svg{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{50%{transform:scale(1.5)}}
.toast.in{animation:toastIn .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
.sheet{animation:sheetUp .42s cubic-bezier(.25,1.25,.5,1)}
.sheet-bg{animation:fade .25s}
@keyframes sheetUp{from{transform:translate(-50%,110%)}}
@keyframes fade{from{opacity:0}}
@keyframes dropIn{from{opacity:0;transform:translateY(-12px)}}
.badge.on .b{animation:none}
.enter .badge.on .b{animation:pop .5s .3s cubic-bezier(.3,1.6,.5,1) both}
.celebrate .bigdrop{animation:dropBounce .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes dropBounce{from{transform:rotate(-45deg) scale(0)}}
.acc .body{animation:rise .3s ease both}
.seg button,.tabs button{transition:background-color .25s,color .25s,transform .18s}

/* mobile: filled blocks to the edges, text keeps its inset */
@media (max-width:540px){
  .section{gap:6px}
  .nearby,.trio,.badges{gap:6px}
  .hero,.card,.req,.nearby,.trio,.badges,.tg,.chat,.acc,.donor-cta,.ai-card,.level,.state,.aifill,.verdict,.celebrate,.tabs,.offline{margin-inline:-10px}
  .ai-card,.level,.hero-img{width:calc(100% + 20px);margin-inline:-10px;max-width:none}
  .card,.req,.stat,.tg,.chat,.acc,.donor-cta,.state{border-radius:26px}
  .hero{border-radius:30px}
  .req{padding:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.story-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;display:block;background:var(--chip)}
.photo-pick{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:12px;cursor:pointer}
.photo-pick .ph{width:64px;height:64px;border-radius:16px;background:var(--chip);display:grid;place-items:center;font-size:24px;font-weight:300;color:var(--muted);flex:none;overflow:hidden}
.photo-pick .ph img{width:100%;height:100%;object-fit:cover}
.counter{font-size:12.5px;color:var(--muted);text-align:right;padding-inline:4px;font-variant-numeric:tabular-nums}
.story .mine-chip{margin-left:auto}

.pet-ava{position:relative;cursor:pointer;overflow:visible}
.pet-ava img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.pet-ava .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px;font-weight:600;border:2px solid var(--bg)}
.ring-wrap{position:relative;width:64px;height:64px;flex:none}
.ring-wrap .rp{position:absolute;inset:10px;border-radius:50%;overflow:hidden;background:var(--chip);display:grid;place-items:center;font-weight:600;font-size:16px}
.ring-wrap .rp img{width:100%;height:100%;object-fit:cover}
.mini-ava{width:22px;height:22px;border-radius:50%;object-fit:cover;margin:-4px 6px -4px -6px;vertical-align:middle}
.photo-pick.big .ph{width:84px;height:84px;border-radius:50%}
.photo-pick.big .ph img{border-radius:50%}

.btn.yab{background:#000;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.ya{width:24px;height:24px;border-radius:50%;background:#FC3F1D;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;line-height:1}

/* pet card */
.pet-card{background:var(--surface);border-radius:30px;overflow:hidden;display:flex;flex-direction:column}
.pc-media{position:relative;height:260px;overflow:hidden;background:#D9A066}
.pc-media img{width:100%;height:100%;object-fit:cover;display:block;animation:zoomIn 1.2s cubic-bezier(.2,.8,.2,1) both}
.pc-media.sp-dog{background:radial-gradient(120% 90% at 80% 20%,#F2C48D 0%,#D9A066 45%,#A8703C 100%)}
.pc-media.sp-cat{background:radial-gradient(120% 90% at 80% 20%,#D5D5DC 0%,#A7A7AF 45%,#6E6E78 100%)}
.pc-art{position:absolute;right:-14px;top:18px;width:230px;height:230px;opacity:.95;animation:floaty 5s ease-in-out infinite}
.pc-art svg{width:100%;height:100%}
.pc-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 30%,transparent 50%,rgba(0,0,0,.55) 100%);pointer-events:none}
.pc-top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.glass-chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;color:#fff;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.18)}
.glass-chip i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7)}
.glass-chip.ok i{background:#5BE3A3;box-shadow:0 0 0 3px rgba(91,227,163,.3)}
.glass-chip.wait i{background:#FFCB45}
.glass-btn{border:0;padding:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.18);transition:transform .18s}
.glass-btn:active{transform:scale(.92)}
.pc-name{position:absolute;left:20px;right:20px;bottom:16px;z-index:2;color:#fff}
.pc-name h2{font-size:42px;line-height:1;letter-spacing:-.055em;font-weight:600}
.pc-name span{display:block;margin-top:6px;font-size:14.5px;opacity:.88}
.pc-body{padding:18px 18px 18px;display:flex;flex-direction:column;gap:16px}
.pc-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pc-fact{background:var(--chip);border-radius:16px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.pc-fact span{font-size:11.5px;color:var(--muted)}
.pc-fact b{font-size:15.5px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-fact b.red{color:var(--accent)}
.pc-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px}
.pc-stats>div{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.pc-stats>div+div{border-left:1px solid var(--line)}
.pc-stats b{font-size:30px;font-weight:300;letter-spacing:-.05em;line-height:1.05}
.pc-stats span{font-size:12.5px;color:var(--muted)}
@media (max-width:420px){.pc-facts{grid-template-columns:repeat(2,1fr)}.pc-media{height:240px}}
@media (max-width:540px){.pet-card{margin-inline:-10px;border-radius:28px}}
@keyframes zoomIn{from{transform:scale(1.08)}}
@keyframes floaty{50%{transform:translateY(-6px) rotate(-2deg)}}
.btn.danger{background:var(--accent);color:#fff}

.want{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:14px 16px;cursor:pointer}
.want b{font-weight:600;letter-spacing:-.015em}
.tgl{position:relative;width:52px;height:32px;flex:none}
.tgl input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.tgl i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background-color .25s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.tgl input:checked+i{background:var(--ok)}
.tgl input:checked+i::after{transform:translateX(20px)}
.tgl input:focus-visible+i{outline:2px solid var(--ink);outline-offset:2px}

.wrow{display:flex;gap:10px;align-items:flex-end;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.wrow .field label{padding-inline:4px}
.wrow .btn{padding-block:15px}
button.pc-fact{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:transform .18s}
button.pc-fact:active{transform:scale(.96)}

.wrow{flex-wrap:wrap}
.wrow .wdate{width:150px}
.wdates{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:-2px 0 6px}
.whist{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.wh{display:grid;grid-template-columns:1fr auto 52px 28px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.whist .flabel+.wh{border-top:0}
.wh .wd{color:var(--muted)}
.wh b{font-weight:600}
.wh .dl{font-size:13px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.wh .dl.up{color:var(--ok)}.wh .dl.down{color:var(--warn)}
.wx{width:28px;height:28px;border-radius:50%;border:0;background:var(--chip);color:var(--muted);font-size:17px;line-height:1;display:grid;place-items:center;padding:0}
@media (max-width:420px){.wrow .field.grow{flex-basis:100%}.wrow .wdate{flex:1}}

.jseg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}

const tq=[];let tBusy=false;
function toast(msg){tq.push(msg);if(!tBusy)nextToast()}
function nextToast(){const t=document.getElementById('toast');if(!tq.length){t.hidden=true;tBusy=false;return}
  tBusy=true;t.textContent=tq.shift();t.hidden=false;t.classList.remove('in');void t.offsetWidth;t.classList.add('in');setTimeout(nextToast,2600)}
function copy(text,okMsg){
  try{navigator.clipboard.writeText(text).then(()=>toast(okMsg),()=>toast('Скопируйте вручную: '+text))}catch(e){toast('Скопируйте вручную: '+text)}

// ---------- геймификация ----------
function level(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k});const cur=LEVELS[i],nx=LEVELS[i+1];
  return {i,name:cur[1],from:cur[0],to:nx?nx[0]:null,next:nx?nx[1]:null,pct:nx?(xp-cur[0])/(nx[0]-cur[0]):1}}
function allStats(){
  const s=state.stats,pets=state.pets;
  return {...s,donations:pets.reduce((a,p)=>a+p.donations,0),
    rare:pets.some(p=>(p.species==='dog'&&p.group==='DEA 1.1−')||(p.species==='cat'&&p.group==='B'))?1:0,
    tg:state.tgConnected?1:0,guides:state.guidesRead.size};
}
function earnedBadges(){const st=allStats();return BADGES.filter(b=>b.v(st)>=b.goal).map(b=>b.id)}
function addXP(n,why){
  if(!state.user)return;
  const before=level(state.xp).i;state.xp+=n;
  toast(`+${drops(n)} · ${why}`);
  const after=level(state.xp);if(after.i>before)toast(`Новый уровень: ${after.name}`);
}
function checkProgress(){
  if(!state.user)return [];
  const fresh=[];
  CHALLENGES.forEach(c=>{if(!state.chalDone.has(c.id)&&state.stats[c.id]>=c.goal){state.chalDone.add(c.id);addXP(c.pts,'задание недели')}});
  earnedBadges().forEach(id=>{if(!state.badgesSeen.has(id)){state.badgesSeen.add(id);const b=BADGES.find(x=>x.id===id);fresh.push(b);toast(`Новая награда: ${b.t}`);addXP(30,'награда')}});
  return fresh;
}
function bump(key,n=1){if(!state.user)return;state.stats[key]=(state.stats[key]||0)+n}

function groupOk(reqGroup,donorGroup,species){
  if(species==='cat'){ if(reqGroup==='не знаю')return true; return reqGroup===donorGroup; }
  if(reqGroup==='DEA 1.1−')return donorGroup==='DEA 1.1−';
  return true;
}
function matchDonors(f){return DONORS.filter(d=>d.species===f.species&&groupOk(f.group,d.group,f.species)&&d.km<=10)}

function eligibility(p){
  const since=p.lastDonation?Math.round((today-p.lastDonation)/DAY):Infinity;
  const gap=p.species==='dog'?60:90;
  const minW=p.species==='dog'?25:4;
  const vacOk=p.med.filter(m=>m.k==='vac'||m.k==='rab').every(m=>m.date&&(today-m.date)/DAY<m.every);
  const checks=[
    {ok:p.age>=1&&p.age<=8,t:'Возраст от 1 до 8 лет',d:p.age?`${p.age} ${plural(p.age,'год','года','лет')}`:'не указан'},
    {ok:p.weight>=minW,t:`Вес от ${minW} кг`,d:p.weight?`${p.weight} кг`:'не указан'},
    {ok:vacOk,t:'Прививки действуют',d:vacOk?'комплекс и бешенство в порядке':'нужна прививка не старше года'},
    {ok:p.healthy,t:'Нет хронических болезней',d:'по словам владельца'},
  ];
  if(p.species==='cat')checks.push({ok:p.indoor,t:'Живёт дома, не гуляет на улице',d:p.indoor?'домашняя':'уличные кошки чаще переносят инфекции'});
  checks.push({ok:since>=gap,t:`Прошло ${gap} дней с прошлой сдачи`,d:!p.lastDonation?'ещё не сдавал(а) кровь':since>=gap?'можно сдавать':`ещё ${gap-since} ${plural(gap-since,'день','дня','дней')}`});
  return {checks,since,gap,ready:checks.every(c=>c.ok),left:Math.max(0,gap-since),fit:checks.slice(0,-1).every(c=>c.ok)};
}

function reminders(){
  const out=[];
  state.pets.forEach(p=>{
    p.med.forEach((m,i)=>{if(m.date){const d=Math.round(m.every-(today-m.date)/DAY);out.push({pet:p,title:m.title,days:d,kind:'med',i})}});
    const e=eligibility(p);if(p.donorOn&&e.fit&&!e.ready)out.push({pet:p,title:'Можно снова сдавать кровь',days:e.left,kind:'ready'});
  });
  return out.sort((a,b)=>a.days-b.days);
}

function readSForm(){const f=state.sform,g=id=>document.getElementById(id);if(!g('s-pet'))return;
  f.pet=g('s-pet').value;f.donor=g('s-donor').value;f.notes=g('s-notes').value;f.text=g('s-text').value;f.consent=g('s-consent').checked}
async function storyAI(){
  readSForm();const f=state.sform;
  if(!f.pet.trim())return fErr('s-pet','Сначала укажите, кого спасли');
  const btn=document.getElementById('s-ai');const ta=document.getElementById('s-text');
  const facts=f.notes.trim();
  const fallback=`${f.pet.trim()} ${facts?'попал(а) в беду: '+facts.replace(/\.$/,'')+'.':'срочно понадобилась кровь.'} Мы создали запрос в Кровинке, и ${f.donor.trim()||'донор'} откликнулся очень быстро. Переливание прошло хорошо, сейчас ${f.pet.trim()} идёт на поправку. Спасибо донору и его хозяевам, вы спасли нашего друга.`;
  if(!AIS.fn||isOffline()){ta.value=fallback;f.text=fallback;document.getElementById('s-count').textContent=fallback.length;toast('Набросали текст по шаблону. Поправьте его под себя');return}
  btn.disabled=true;btn.textContent='Пишу…';
  const prompt=`Напиши тёплую короткую историю для ленты «Спасённые хвосты» в приложении донорства крови для собак и кошек. Пиши от лица хозяина спасённого питомца, по-русски, простыми словами, 3–4 предложения, не больше 450 символов, без эмодзи и хэштегов.
Спасённый питомец: ${f.pet.trim()}. Донор: ${f.donor.trim()||'не указан'}.
Факты от хозяина: """${(facts||'нет').slice(0,600)}"""
Не придумывай диагнозы, клиники, сроки и детали, которых нет в фактах. Закончи благодарностью донору. Ответь только текстом истории.`;
  try{
    const r=await AIS.fn(prompt,{modelTier:'quick',cache:false,onText:({text})=>{ta.value=text.slice(0,600);document.getElementById('s-count').textContent=ta.value.length}});
    f.text=r.text.trim().slice(0,600);ta.value=f.text;document.getElementById('s-count').textContent=f.text.length;toast('Готово. Прочитайте и поправьте, если нужно');
  }catch(e){if(e&&e.code==='not_granted')AIS.fn=null;ta.value=fallback;f.text=fallback;document.getElementById('s-count').textContent=fallback.length;toast('ИИ не ответил, набросали текст по шаблону')}
  finally{btn.disabled=false;btn.textContent='Написать текст за меня'}
}
function publishStory(){
  readSForm();const f=state.sform;
  if(!f.pet.trim())return fErr('s-pet','Укажите, кого спасли');
  if(!f.donor.trim())return fErr('s-donor','Укажите донора, чтобы он получил благодарность');
  if(f.text.trim().length<30)return fErr('s-text','Напишите хотя бы пару предложений, от 30 символов');
  if(/(\+7|8)[\s(-]*\d{3}[\s)-]*\d{3}[\s-]*\d{2}[\s-]*\d{2}/.test(f.text))return fErr('s-text','Уберите номер телефона из текста, он будет виден всем');
  if(!f.consent)return fErr('s-consent','Нужно согласие на публикацию');
  if(isOffline()){toast('Нет соединения. Черновик сохранён, опубликуем, когда появится связь');return}
  state.stories.unshift({pet:f.pet.trim(),donor:f.donor.trim(),text:f.text.trim(),photo:f.photo,when:'только что',thanks:0,on:false,mine:true});
  state.sform=emptySForm();
  go({type:'stories'});toast('История опубликована. Донор получил вашу благодарность');addXP(20,'история спасения');
}

function journalSection(p){
  const J=[...(p.journal||[])].sort((a,b)=>b.date-a.date);

  const list=J.filter(x=>f==='all'||MK[x.kind].g===f);
  let lastY=null;
  const rows=list.map(x=>{const y=x.date.getFullYear();const head=y!==lastY?`<div class="jy">${y}</div>`:'';lastY=y;
    const next=x.every?new Date(+x.date+x.every*DAY):null;
    return `${head}<button class="jrow" data-act="jEdit" data-id="${x.id}"><span class="jdot g-${MK[x.kind].g}" aria-hidden="true"></span>

  return `<section class="section" id="journal">

function petToForm(p){

  return {...emptyDForm(),editId:p.id,wantDonor:p.wantDonor!==false,photo:p.photo||null,species:p.species,name:p.name,breed:p.breed,age:String(p.age),weight:String(p.weight),

function syncDonorList(p){
  const i=DONORS.findIndex(d=>d.id==='d'+p.id);if(i>=0)DONORS.splice(i,1);
  if(p.donorOn&&eligibility(p).fit)DONORS.push({id:'d'+p.id,name:p.name,species:p.species,breed:p.breed,weight:p.weight,group:p.group==='не знаю'?'?':p.group,district:p.district,km:1.2});
}
function updatePet(f){
  const p=state.pets.find(x=>x.id===f.editId);if(!p)return;
  const n=buildPet(f);const wasFit=eligibility(p).fit;
  const wasOn=p.donorOn;
  Object.assign(p,{wantDonor:n.wantDonor,name:n.name,species:n.species,breed:n.breed,age:n.age,group:n.group,district:n.district,healthy:n.healthy,indoor:n.indoor,photo:f.photo||null});
  if(n.weight!==p.weight){addWeight(p,n.weight,new Date(today))}
  if(f.vacDate){const d=new Date(f.vacDate);['vac','rab'].forEach(k=>{const m=p.med.find(x=>x.k===k);if(m&&(!m.date||iso(m.date)!==f.vacDate))p.journal=[...(p.journal||[]),jEntry(k,m.product||'',d)]});recalcMed(p)}
  if(!p.donations){p.lastDonation=f.never||!f.lastDon?null:new Date(f.lastDon)}
  else if(f.lastDon){p.lastDonation=new Date(f.lastDon)}
  const e=eligibility(p);
  p.donorOn=p.wantDonor&&e.fit;
  syncDonorList(p);state.pet=p;
  state.dform=emptyDForm();state.view=null;state.tab='profile';state.ptab='pets';state.anim=true;render();window.scrollTo(0,0);
  toast(!p.wantDonor&&wasOn?`Сохранено. ${p.name} больше не получает SOS-запросы`:p.wantDonor&&!e.fit?`Сохранено. ${p.name} пока не проходит требования донора, SOS-запросы включатся, когда всё совпадёт`:p.donorOn&&!wasOn?`Сохранено. ${p.name} теперь в базе доноров`:'Изменения сохранены');
}
function saveDonor(){
  const f=state.dform;
  if(!f.name.trim())return fErr('d-name','Укажите кличку питомца');
  const p=buildPet(f);
  if(!p.age)return fErr('d-age','Укажите возраст, можно примерно');
  if(p.age>30)return fErr('d-age','Проверьте возраст: больше 30 лет выглядит как опечатка');
  if(!p.weight)return fErr('d-w','Укажите вес, от него зависит допуск к донорству');
  if(p.weight>100||(p.species==='cat'&&p.weight>15))return fErr('d-w',p.species==='cat'?'Проверьте вес: для кошки обычно до 15 кг':'Проверьте вес: для собаки обычно до 100 кг');
  if(f.vacDate&&new Date(f.vacDate)>today)return fErr('d-vac','Дата прививки не может быть в будущем');
  if(!f.never&&f.lastDon&&new Date(f.lastDon)>today)return fErr('d-last','Дата сдачи не может быть в будущем');
  if(f.editId)return updatePet(f);
  const e=eligibility(p);p.donorOn=p.wantDonor&&e.fit;
  state.pets.push(p);state.pet=p;
  syncDonorList(p);
  state.dform=emptyDForm();state.view=null;state.tab='profile';state.ptab='pets';render();window.scrollTo(0,0);
  toast(!p.wantDonor?`${p.name} добавлен(а). Медкарта и напоминания уже работают`:e.fit?`${p.name} теперь в базе доноров`:`${p.name} добавлен(а). Донорство включится, когда всё совпадёт`);
  if(p.donorOn)addXP(50,'новый донор');
  checkProgress();render();
}

function loadPhoto(file,max){
  return new Promise((res,rej)=>{
    if(!file)return rej('none');
    if(!/^image\//.test(file.type))return rej('Нужна фотография: JPG, PNG или HEIC');
    if(file.size>15*1024*1024)return rej('Фото больше 15 МБ. Выберите снимок поменьше');
    const url=URL.createObjectURL(file),img=new Image();

const DIST_C={'Адмиралтейский':[59.9155,30.2980],'Василеостровский':[59.9420,30.2500],'Выборгский':[60.0450,30.3300],'Калининский':[60.0000,30.3900],
 'Кировский':[59.8790,30.2610],'Красногвардейский':[59.9700,30.4700],'Московский':[59.8520,30.3200],'Невский':[59.8950,30.4600],
 'Петроградский':[59.9660,30.3100],'Приморский':[60.0000,30.2500],'Фрунзенский':[59.8700,30.3800],'Центральный':[59.9330,30.3600]};
function hav(a,b){const R=6371,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;
  const h=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function jitter(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))|0;return [((h%100)/100)*0.018-0.009,(((h>>7)%100)/100)*0.03-0.015]}
function place(district,id){const c=DIST_C[district]||DIST_C['Центральный'];const j=jitter(id);return [c[0]+j[0],c[1]+j[1]]}
function nearestDistrict(pt){let best=null,bd=1e9;for(const [n,c] of Object.entries(DIST_C)){const d=hav(pt,c);if(d<bd){bd=d;best=n}}return {name:best,km:bd}}
function setLoc(pt,label,source){
  state.loc={pt,label,source};
  const km=q=>Math.max(0.3,Math.round(hav(pt,q)*10)/10);
  DONORS.forEach(d=>d.km=km(place(d.district,d.id)));
  CLINICS.forEach(c=>c.km=km(place(c.addr.replace(' р-н',''),c.id)));
  state.requests.forEach(r=>{if(!r.mine){const c=clinic(r.clinic);if(c)r.km=c.km}});
  const near=[...CLINICS].filter(c=>c.night).sort((a,b)=>a.km-b.km)[0];
  if(near&&!state.form.pet&&!state.form.aiText)state.form.clinic=near.id;
}
function locate(){
  const fail=why=>{state.locBusy=false;state.locError=why;if(!(state.view&&state.view.type==='city'))go({type:'city'});else render()};
  state.locError=null;
  if(!('geolocation' in navigator)){fail('Геолокация недоступна. Выберите район вручную');return}
  state.locBusy=true;render();
  try{
    navigator.geolocation.getCurrentPosition(pos=>{
      state.locBusy=false;state.locError=null;const pt=[pos.coords.latitude,pos.coords.longitude];const nd=nearestDistrict(pt);
      if(nd.km>30){setLoc(DIST_C['Центральный'],'Центральный','default');toast('Похоже, вы не в Петербурге. Показываем расстояния от центра');}
      else{setLoc(pt,nd.name,'gps');toast(`Вы в районе: ${nd.name}. Расстояния пересчитаны`)}
      render();
    },err=>fail(err&&err.code===1?'Доступ к геолокации запрещён. Разрешите его в настройках браузера или выберите район ниже.':err&&err.code===3?'Не успели определить местоположение. Попробуйте ещё раз на улице или выберите район ниже.':'Не удалось определить местоположение. Выберите район ниже.'),{enableHighAccuracy:false,timeout:8000,maximumAge:600000});
  }catch(e){fail('Браузер не дал доступ к местоположению. Выберите район вручную')}
}

const fillPrompt=t=>`Владелец питомца в стрессе описал ситуацию одной фразой. Разбери её в поля запроса донора крови.
Текст: """${t.slice(0,1000)}"""
Клиники (id — название, район): ${CLINICS.map(c=>`${c.id} — ${c.name}, ${c.addr}`).join('; ')}.
Правила: species "dog" или "cat"; weight — число кг или null; group — одно из "не знаю","DEA 1.1+","DEA 1.1−" для собак или "не знаю","A","B","AB" для кошек; clinic — id из списка, если клиника угадывается, иначе null; urgency "now" (прямо сейчас, травма, кровотечение), "today" (сегодня) или "plan" (плановая операция в ближайшие дни); pet — кличка или ""; reason — что случилось, до 120 символов; post — короткий текст до 400 символов для районных чатов о поиске донора: кто нужен (вид, вес от 25 кг для собак или от 4 кг для кошек, возраст 1–8 лет, привитые), клиника, срочность, без телефонов и ссылок. Не придумывай то, чего нет в тексте.
Ответь только JSON: {"species":"dog","pet":"","weight":null,"group":"не знаю","clinic":null,"urgency":"now","reason":"","post":""}`;
function parseFill(t){
  const low=t.toLowerCase();
  const species=/кошк|кот\b|кота|котик|котён|котен/.test(low)?'cat':'dog';
  const wm=low.match(/(\d+(?:[.,]\d+)?)\s*(кг|кило)/);
  const clinicId=/охт|красногвард/.test(low)?'c2':/приморск/.test(low)?'c4':/васильевск|васьк/.test(low)?'c5':/петроград|северн/.test(low)?'c1':/московск|лап[аы] и хвост/.test(low)?'c3':null;
  const urgency=/операц|планов|завтра|послезавтра/.test(low)?'plan':/сбил|дтп|кровотеч|срочно|сейчас|отрав|без сознания/.test(low)?'now':'today';
  let group='не знаю';if(species==='cat'){const g=t.match(/групп\S*\s*(AB|АВ|A|B|А|В)(?![А-Яа-яA-Za-z])/i);if(g)group=g[1].toUpperCase().replace(/А/g,'A').replace(/В/g,'B')}
  else if(/1\.1\s*[-−]|отрицат/.test(low))group='DEA 1.1−';else if(/1\.1\s*\+|положит/.test(low))group='DEA 1.1+';
  const nm=t.match(/(?:зовут|кличка|по кличке)\s+([А-ЯЁA-Z][а-яёa-z-]+)/)||t.match(/(?:лабрадор|овчарк\S*|ретривер|метис|хаски|кот|кошка|пёс|пес|собака)\s+([А-ЯЁ][а-яё-]+)/i);
  return {species,pet:nm?nm[1]:'',weight:wm?parseFloat(wm[1].replace(',','.')):null,group,clinic:clinicId,urgency,reason:t.slice(0,120),post:''};
}
function normFill(j,t){
  const b=parseFill(t);j=j&&typeof j==='object'?j:{};
  const species=j.species==='cat'||j.species==='dog'?j.species:b.species;
  const groups=species==='dog'?['не знаю','DEA 1.1+','DEA 1.1−']:['не знаю','A','B','AB'];
  const g=typeof j.group==='string'?j.group.replace('-','−'):'';
  const w=Number(j.weight);
  return {species,pet:typeof j.pet==='string'?j.pet.slice(0,30):b.pet,weight:w>0&&w<120?w:b.weight,group:groups.includes(g)?g:groups.includes(b.group)?b.group:'не знаю',
    clinic:CLINICS.some(c=>c.id===j.clinic)?j.clinic:b.clinic,urgency:['now','today','plan'].includes(j.urgency)?j.urgency:b.urgency,
    reason:typeof j.reason==='string'&&j.reason.trim()?j.reason.trim().slice(0,200):b.reason,post:typeof j.post==='string'?j.post.trim().slice(0,600):''};
}
function postTemplate(r){
  const c=clinic(r.clinic);
  return `${r.urgency==='now'?'Срочно нужен':'Нужен'} донор крови${r.pet?' для '+r.pet:''}. ${r.species==='dog'?'Собака':'Кошка'}${r.weight?', '+r.weight+' кг':''}${r.group&&r.group!=='не знаю'?', группа '+r.group:''}. Клиника: ${c.name} (${c.addr}). Подойдёт ${r.species==='dog'?'собака от 25 кг':'кошка от 4 кг'}, 1–8 лет, с действующими прививками.`;
}
async function aiFill(){
  readForm();const el=document.getElementById('f-ai');const t=(el?el.value:'').trim();state.form.aiText=t;
  if(t.length<5)return fErr('f-ai','Опишите ситуацию хотя бы в нескольких словах: кто, вес, клиника');
  const btn=document.getElementById('aifill-btn');if(btn){btn.disabled=true;btn.textContent='Разбираю описание…'}
  let j=null,used=false;

const SCAN_PROMPT=`На фото страница ветеринарного паспорта собаки или кошки (обычно на русском, бывают наклейки вакцин и отметки врача). Извлеки данные.
Правила: даты в формате YYYY-MM-DD; kind прививки: "complex" (комплексная: чума, парвовирус, гепатит, панлейкопения и т. п.), "rabies" (бешенство) или "other"; kind обработки: "tick" (от клещей и блох) или "worm" (от глистов). Если поле не видно или не читается, ставь null или пустой массив. Ничего не придумывай. Если это не ветпаспорт, верни все поля пустыми.
Ответь только JSON: {"name":null,"species":null,"breed":null,"birthDate":null,"vaccinations":[{"kind":"rabies","date":"2025-03-14"}],"treatments":[{"kind":"tick","date":"2025-05-01"}]}`;
const DEMO_SCAN=()=>({name:'Рекс',species:'dog',breed:'Немецкая овчарка',birthDate:iso(daysAgo(365*3+40)),
  vaccinations:[{kind:'complex',date:iso(daysAgo(120))},{kind:'rabies',date:iso(daysAgo(120))}],treatments:[{kind:'tick',date:iso(daysAgo(20))},{kind:'worm',date:iso(daysAgo(45))}]});
function scanDates(j){
  const latest=(arr,kinds)=>(Array.isArray(arr)?arr:[]).filter(x=>x&&kinds.includes(x.kind)&&okDate(x.date)).map(x=>x.date).sort().pop()||null;
  return {vac:latest(j.vaccinations,['complex','rabies']),complex:latest(j.vaccinations,['complex']),rabies:latest(j.vaccinations,['rabies']),tick:latest(j.treatments,['tick']),worm:latest(j.treatments,['worm'])};
}
async function scanPassport(file,target){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('Нужна фотография: JPG, PNG или HEIC');return}
  if(file.size>15*1024*1024){toast('Фото больше 15 МБ. Сделайте снимок поменьше или обрежьте его');return}
  if(isOffline()){toast('Нет соединения. Распознаем фото, когда появится интернет');return}
  let j=null,demo=false;
  if(AIS.fn&&AIS.img){
    toast('Читаю ветпаспорт, это займёт до минуты');
    try{j=await askJSON(SCAN_PROMPT,{images:file})}catch(e){if(e&&e.code==='image_rejected'){toast('Не получилось прочитать фото. Сделайте снимок ровнее, без бликов');return}}
  }
  if(!j||typeof j!=='object'){j=DEMO_SCAN();demo=true}
  const d=scanDates(j),found=[];
  if(target==='dform'){
    readDForm();const f=state.dform;
    if(typeof j.name==='string'&&j.name.trim()){f.name=j.name.trim().slice(0,30);found.push('кличку')}
    if(j.species==='dog'||j.species==='cat'){if(f.species!==j.species)f.group='не знаю';f.species=j.species}
    if(typeof j.breed==='string'&&j.breed.trim()){f.breed=j.breed.trim().slice(0,40);found.push('породу')}
    if(okDate(j.birthDate)){f.age=String(Math.max(0,Math.round((today-new Date(j.birthDate))/DAY/365.25*10)/10));found.push('возраст')}
    if(d.vac){f.vacDate=d.vac;found.push('прививку от '+fmt(new Date(d.vac)))}
    f.tickDate=d.tick;f.wormDate=d.worm;if(d.tick||d.worm)found.push('обработки');
    if(state.view&&state.view.type==='addDonor')render();
  }else if(state.pet){
    const map={vac:d.complex||d.vac,rab:d.rabies||d.vac,tick:d.tick,worm:d.worm};
    const p=state.pet;p.med.forEach(m=>{const nd=map[m.k];if(nd&&(!m.date||new Date(nd)>m.date)){p.journal=[...(p.journal||[]),jEntry(m.k,'',new Date(nd),undefined,'Из фото ветпаспорта')];found.push(m.title.toLowerCase())}});recalcMed(p);
    render();
  }
  toast(demo?`Демо: ИИ с фото недоступен в этом просмотре, показан пример. Нашли: ${found.join(', ')||'ничего нового'}`:found.length?`Нашли: ${found.join(', ')}. Проверьте данные`:'Не нашли новых данных на фото');
}

function requireAuth(reason,after){
  if(state.user){after();return}
  state.loginReason=reason;state.pending=after;state.login={step:'choose',phone:'',code:'',name:'',consent:state.login.consent};
  go({type:'login'});
}
function finishLogin(user){
  user.links=new Set([user.method]);state.user=user;
  const demo=user.method!=='phone';
  if(demo){
    state.pets=[demoPet()];state.pet=state.pets[0];
    state.xp=540;state.stats={...freshStats(),shares:2,responds:3,medMarks:2,fast:1,night:1,wkShares:1};
  }else{state.pets=[];state.pet=null;state.xp=0;state.stats=freshStats()}
  state.badgesSeen=new Set(earnedBadges());state.chalDone=new Set();
  const after=state.pending;state.pending=null;state.loginReason=null;
  state.view=null;
  toast(demo?`Здравствуйте, ${user.name}! Это демо-аккаунт с питомцем Джесси`:`Аккаунт создан. Здравствуйте, ${user.name}!`);
  if(after)after();else goTab(demo?'profile':'home');
  if(!demo&&!after&&!state.pets.length){
    state.sheet={title:'Есть собака или кошка?',text:'Проверим за минуту, может ли питомец стать донором и спасать жизни. Даже если нет, пригодятся медкарта и напоминания о прививках.',
      actions:[{label:'Да, проверить',act:'addDonor',primary:true},{label:'Пока нет',act:'sheetClose'}]};
  }
  render();
}

function bindForms(){
  const cf2=document.getElementById('chatform');if(cf2)cf2.addEventListener('submit',ev=>{ev.preventDefault();const r=state.requests.find(x=>x.id===cf2.dataset.id);const i=document.getElementById('m-text');if(r&&sendMsg(r,i.value)){setTimeout(()=>{const l=document.getElementById('chatlog');if(l)l.scrollTop=l.scrollHeight;const n=document.getElementById('m-text');n&&n.focus()},30)}});
  const qf=document.getElementById('q-from'),qt=document.getElementById('q-to');if(qf)qf.addEventListener('change',()=>{state.notif.quietFrom=qf.value});if(qt)qt.addEventListener('change',()=>{state.notif.quietTo=qt.value});
  const jf=document.getElementById('jform');if(jf)jf.addEventListener('submit',ev=>{ev.preventDefault();saveJournal()});
  const wf=document.getElementById('wform');
  if(wf)wf.addEventListener('submit',ev=>{ev.preventDefault();const p=state.pet;const v=parseFloat(String(document.getElementById('w-new').value).replace(',','.'));

    const dv=document.getElementById('w-date').value;if(!dv)return fErr('w-date','Укажите дату взвешивания');const d=new Date(dv);
    if(d>today)return fErr('w-date','Дата не может быть в будущем');if(d<new Date('2000-01-01'))return fErr('w-date','Проверьте год');
    const was=eligibility(p).fit;const r=Math.round(v*10)/10;addWeight(p,r,d);
    const now=eligibility(p).fit;if(p.wantDonor!==false)p.donorOn=now;syncDonorList(p);render();
    toast(was&&!now?`Записали ${kg(r)} кг. Это меньше минимума для донорства, SOS-запросы выключены`:!was&&now&&p.wantDonor!==false?`Записали ${kg(r)} кг. ${p.name} снова подходит в доноры`:`Записали ${kg(r)} кг за ${fmt(d)}${+d!==+today&&p.weight!==r?'. Текущий вес не изменился, есть более свежая запись':''}`);
    addXP(5,'взвешивание');checkProgress();
    const w=document.getElementById('weight');if(w)w.scrollIntoView({block:'start'});});
  const sf=document.getElementById('storyform');

    sf.addEventListener('submit',ev=>{ev.preventDefault();publishStory()});
