    const ph=document.getElementById('s-photo');ph.addEventListener('change',()=>{const file=ph.files[0];ph.value='';if(!file)return;
      if(!/^image\//.test(file.type)){toast('Нужна фотография: JPG, PNG или HEIC');return}
      if(file.size>15*1024*1024){toast('Фото больше 15 МБ. Выберите снимок поменьше');return}
      readSForm();loadPhoto(file,1080).then(u=>{state.sform.photo=u;render()},m=>{if(m!=='none')toast(m)})});
  }
  const cf=document.getElementById('checkform');
  if(cf)cf.addEventListener('submit',ev=>{ev.preventDefault();runCheck()});
  const dp=document.getElementById('d-photo');if(dp)dp.addEventListener('change',()=>{const file=dp.files[0];dp.value='';readDForm();
    loadPhoto(file,640).then(u=>{state.dform.photo=u;render()},m=>{if(m!=='none')toast(m)})});
  const pp=document.getElementById('p-photo');if(pp)pp.addEventListener('change',()=>{const file=pp.files[0];pp.value='';
    loadPhoto(file,640).then(u=>{state.pet.photo=u;render();toast('Фото обновлено')},m=>{if(m!=='none')toast(m)})});
  const ds=document.getElementById('d-scan');if(ds)ds.addEventListener('change',()=>{scanPassport(ds.files[0],'dform');ds.value=''});
  const ms=document.getElementById('m-scan');if(ms)ms.addEventListener('change',()=>{scanPassport(ms.files[0],'med');ms.value=''});
  const sos=document.getElementById('sosform');
  if(sos)sos.addEventListener('submit',ev=>{ev.preventDefault();readForm();if(!validSos())return;requireAuth('Чтобы донор мог с вами связаться, войдите.',submitSos)});
  const df=document.getElementById('donorform');
  if(df){
    df.addEventListener('input',()=>{readDForm();document.getElementById('elig').innerHTML=eligHtml(state.dform)});
    df.addEventListener('change',ev=>{if(ev.target.id==='d-never'||ev.target.id==='d-want'){readDForm();render()}});
    df.addEventListener('submit',ev=>{ev.preventDefault();readDForm();saveDonor()});
  }
  const lf=document.getElementById('loginform');
  if(lf)lf.addEventListener('submit',ev=>{ev.preventDefault();const L=state.login,step=lf.dataset.step;
    if(step==='phone'){const v=document.getElementById('l-phone').value.trim();const dg=v.replace(/\D/g,'');if(dg.length<10)return fErr('l-phone','Введите номер полностью: 10 цифр после +7');if(dg.length>11||(dg.length===11&&!/^[78]/.test(dg)))return fErr('l-phone','Похоже, номер не российский. Сейчас вход работает для номеров +7');
      if(isOffline())return fErr('l-phone','Нет соединения, не можем отправить СМС. Проверьте интернет');
      L.phone=v;L.step='code';L.tries=0;L.resendAt=Date.now()+30000;L.lockUntil=0;render();toast('Код отправлен');setTimeout(()=>{const c=document.getElementById('l-code');c&&c.focus()},50)}
    else if(step==='code'){if(L.lockUntil>Date.now())return;const v=document.getElementById('l-code').value.trim();if(!/^\d{4}$/.test(v))return fErr('l-code','Код состоит из 4 цифр');
      if(v!=='1234'){L.tries=(L.tries||0)+1;if(L.tries>=3){L.lockUntil=Date.now()+60000;L.resendAt=L.lockUntil;render();return fErr('l-code','Слишком много попыток. Запросите новый код через минуту')}return fErr('l-code',`Неверный код. Осталось попыток: ${3-L.tries}. В демо подходит 1234`)}L.step='name';render()}
    else{const v=document.getElementById('l-name').value.trim();if(!v)return fErr('l-name','Укажите имя, его увидит хозяин или донор');if(v.length>40)return fErr('l-name','Слишком длинное имя, до 40 символов');finishLogin({name:v,method:'phone',phone:L.phone})}
  });
  const dn=document.getElementById('donateform');
  if(dn)dn.addEventListener('submit',ev=>{ev.preventDefault();const p=state.pet;const dv=document.getElementById('dn-date').value;const cl=document.getElementById('dn-clinic').value;
    if(!dv)return fErr('dn-date','Укажите дату сдачи');const d=new Date(dv);if(d>today)return fErr('dn-date','Дата не может быть в будущем');
    p.pending={date:d,clinic:cl};p.lastDonation=d;if(p.wantDonor!==false)p.donorOn=eligibility(p).fit;syncDonorList(p);
    state.view=null;render();window.scrollTo(0,0);toast('Отправили клинике на подтверждение. В демо оно придёт через 5 секунд');
    setTimeout(()=>{if(!p.pending)return;const ld=p.pending.date;creditDonation(p,cl);p.lastDonation=ld;toast(`${clinic(cl).name} подтвердила сдачу`);go({type:'celebrate'})},5000)});
  document.querySelectorAll('details[data-guide]').forEach(el=>el.addEventListener('toggle',()=>{
    if(!el.open)return;const id=el.dataset.guide;if(state.guidesRead.has(id))return;
    state.guidesRead.add(id);if(state.user){bump('wkGuide');addXP(5,'инструкция');checkProgress()}
    const s=el.querySelector('summary');if(s&&!s.querySelector('.read-tick'))s.insertAdjacentHTML('beforeend',' <span class="read-tick">прочитано</span>');
  }));
}
function readForm(){
  const f=state.form;const g=id=>document.getElementById(id);
  if(g('f-pet'))f.pet=g('f-pet').value;if(g('f-w'))f.weight=g('f-w').value;
  if(g('f-clinic'))f.clinic=g('f-clinic').value;if(g('f-reason'))f.reason=g('f-reason').value;if(g('f-ai'))f.aiText=g('f-ai').value;
}
function validSos(){
  const f=state.form,w=parseFloat(String(f.weight).replace(',','.'));
  if(!f.pet.trim())return fErr('f-pet','Укажите кличку, чтобы донор понимал, к кому едет');
  if(!w)return fErr('f-w','Укажите примерный вес, от него зависит подбор донора');
  if(f.species==='dog'&&(w<1||w>100))return fErr('f-w','Проверьте вес: для собаки обычно от 1 до 100 кг');
  if(f.species==='cat'&&(w<0.5||w>15))return fErr('f-w','Проверьте вес: для кошки обычно от 0,5 до 15 кг');
  return true;
}
function viewSosError(){
  const c=clinic(state.form.clinic);
  return `${backBar('← К форме','sos')}<div style="margin-top:18px">${stateCard({bad:true,icon:'!',title:'Не удалось отправить запрос',
    text:'Сервер не ответил. Мы сохранили всё, что вы ввели. Попробуйте ещё раз, а пока позвоните в клинику напрямую, там могут знать доноров.',
    actions:`<button class="btn primary wide" data-act="retrySos">Отправить ещё раз</button><div class="row wrap" style="gap:10px"><span class="phone">${c.phone}</span><button class="btn" data-act="copyphone" data-phone="${c.phone}">Скопировать телефон клиники</button></div>`})}</div>`;
}
function submitSos(){
  const f=state.form;
  if(!validSos()){state.tab='sos';state.view=null;render();validSos();return}
  const w=parseFloat(String(f.weight).replace(',','.'));
  if(state.sim.serverFail){state.sim.serverFail=false;go({type:'sosError'});return}
  const m=matchDonors(f).sort((a,b)=>a.km-b.km);
  const off=isOffline();
  const r={id:'r'+Date.now(),pet:f.pet.trim(),species:f.species,breed:f.species==='dog'?'собака':'кошка',weight:w,group:f.group,reason:f.reason.trim(),clinic:f.clinic,urgency:f.urgency,ago:'только что',km:0,owner:'вы',responders:0,mine:true,notified:m.length,respList:[],waiting:!off&&m.length>0,queued:off,_m:m};
  r.post=f.post||postTemplate(r);
  state.requests.unshift(r);
  state.form={species:'dog',weight:'',group:'не знаю',clinic:'c1',urgency:'now',pet:'',reason:'',aiText:'',post:''};
  state.tab='requests';go({type:'req',id:r.id});
  if(off){toast('Нет связи. Запрос сохранён и отправится автоматически');return}
  toast('Запрос отправлен');
  dispatch(r,m);
}
function dispatch(r,m){
  m.slice(0,3).forEach((d,i,arr)=>setTimeout(()=>{
    r.respList.push({...d,owner:OWNERS[(i*3+d.name.length)%OWNERS.length],phone:'+7 000 000-00-0'+(i+1),chosen:false});
    r.responders=r.respList.length;if(i===arr.length-1)r.waiting=false;
    if(state.view&&state.view.id===r.id)render();
    toast(`${d.name} может приехать`);
  },2500+i*3000));
}
function doHelp(id){
  const r=state.requests.find(x=>x.id===id);
  const who=r.species==='dog'?'собаки':'кошки';
  const cands=state.pets.filter(p=>p.species===r.species);
  if(!cands.length){
    state.sheet={title:`Нужна ${r.species==='dog'?'собака':'кошка'}-донор`,
      text:`В вашем профиле пока нет ${who}. Добавьте питомца: проверка займёт минуту, и в следующий раз вы сможете откликнуться. А сейчас помочь ${r.pet} можно репостом.`,
      actions:[{label:'Добавить питомца-донора',act:'addDonor',primary:true,sp:r.species},{label:'Поделиться запросом',act:'share',id:r.id}]};
    render();return;
  }
  const ok=cands.find(p=>p.donorOn&&eligibility(p).ready);
  if(!ok){
    const p=cands[0],e=eligibility(p),bad=e.checks.find(c=>!c.ok);
    state.sheet=e.fit
      ?{title:`${p.name} ещё восстанавливается`,text:`После прошлой сдачи ${p.name} сможет помочь через ${e.left} ${plural(e.left,'день','дня','дней')}. Сейчас лучше всего помочь ${r.pet} репостом. Если у вас есть ещё ${r.species==='dog'?'собака':'кошка'}, добавьте её.`,
        actions:[{label:'Поделиться запросом',act:'share',id:r.id,primary:true},{label:'Добавить другого питомца',act:'addDonor',sp:r.species}]}
      :{title:`${p.name} пока не подходит в доноры`,text:`Не выполнено условие: ${bad?bad.t.toLowerCase():'требования донора'}. Если у вас есть другой питомец, проверьте его. А ${r.pet} можно помочь репостом.`,
        actions:[{label:'Добавить другого питомца',act:'addDonor',primary:true,sp:r.species},{label:'Поделиться запросом',act:'share',id:r.id}]};
    render();return;
  }
  r.helped=true;r.helpPet=ok.id;r.responders++;bump('responds');render();
  toast(`Хозяин получил отклик: ${ok.name} готов(а) помочь`);addXP(20,'отклик на SOS');checkProgress();render();
  const tok=Date.now();r.helpTok=tok;
  setTimeout(()=>{if(!r.helped||r.helpTok!==tok||!state.requests.includes(r))return;
    r.picked={tok,st:0,pet:ok.name,petId:ok.id,phone:'+7 000 000-00-09'};r.msgs=[];sysMsg(r,`${r.owner} выбрал(а) вас донором`);
    toast(`${r.owner} выбрал(а) ${ok.name}! Адрес клиники в запросе`);render()},5000);
}

document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(state.sheet&&(a==='sheetClose'||b.closest('.sheet'))){state.sheet=null;if(a==='sheetClose'){render();return}}
  if(a==='donorToggle'){state.pet.wantDonor=b.checked;state.pet.donorOn=b.checked;syncDonorList(state.pet);toast(b.checked?`${state.pet.name} снова получает SOS-запросы`:'Уведомления о SOS выключены');render();return}
  if(a==='nset'){state.notif[b.dataset.k]=b.checked;return}
  if(a==='setN'){state.notif[b.dataset.k]=b.checked;render();if(b.dataset.k==='sos'&&!b.checked)toast('SOS-запросы выключены. Питомец не будет получать просьбы о помощи');return}
  if(a==='setP'){state.privacy[b.dataset.k]=b.checked;return}
  if(a==='simOffline'){state.sim.offline=b.checked;if(!b.checked&&navigator.onLine)flushQueue();else render();return}
  if(a==='simEmpty'){state.sim.empty=b.checked;render();return}
  if(a==='simFail'){state.sim.serverFail=b.checked;return}
  if(a==='consent'){state.login.consent=b.checked;return}
  switch(a){
    case 'tab':goTab(b.dataset.tab);break;
    case 'check':state.check=newCheck();go({type:'check'});break;
    case 'cset':{const t=document.getElementById('c-text');if(t)state.check.text=t.value;state.check.species=b.dataset.v;render();break}
    case 'csym':{const t=document.getElementById('c-text');if(t){t.value=(t.value.trim()?t.value.trim().replace(/[,.]$/,'')+', ':'')+b.dataset.s.toLowerCase();state.check.text=t.value;t.focus()}break}
    case 'cans':state.check.answers[+b.dataset.i]=b.dataset.v;render();break;
    case 'cfinal':finalCheck();break;
    case 'cstop':if(state.check.ctl)state.check.ctl.abort();break;
    case 'creset':state.check=newCheck();render();window.scrollTo(0,0);break;
    case 'sosFromCheck':{const c=state.check;state.form={...state.form,species:c.species,group:'не знаю',urgency:c.result.level==='urgent'?'now':'today',reason:c.text.slice(0,200)};
      if(state.pet&&state.pet.species===c.species){state.form.pet=state.pet.name;state.form.weight=String(state.pet.weight)}goTab('sos');break}
    case 'aifill':aiFill();break;
    case 'jNew':state.jform={id:null,kind:'tick',product:'',date:new Date(today),every:MK.tick.every,note:''};go({type:'jEntry'});break;
    case 'jEdit':{const x=state.pet.journal.find(q=>q.id===b.dataset.id);if(x){state.jform={id:x.id,kind:x.kind,product:x.product,date:x.date,every:x.every,note:x.note};go({type:'jEntry'})}break}
    case 'jKind':readJForm();state.jform.kind=b.dataset.k;state.jform.product='';state.jform.every=MK[b.dataset.k].every;render();break;
    case 'jSug':readJForm();state.jform.product=b.dataset.v;state.jform.every=everyFor(state.jform.kind,b.dataset.v,state.pet.species);render();break;
    case 'jFilter':state.jfilter=b.dataset.k;render();break;
    case 'jDel':{readJForm();const x=state.pet.journal.find(q=>q.id===b.dataset.id);if(!x)break;
      state.sheet={title:'Удалить запись?',text:`${x.product||MK[x.kind].t} от ${fmtY(x.date)}. Напоминания пересчитаются по оставшимся записям.`,actions:[{label:'Удалить',act:'jDelOk',danger:true,id:x.id},{label:'Отмена',act:'sheetClose'}]};render();break}
    case 'jDelOk':{const p=state.pet;p.journal=p.journal.filter(q=>q.id!==b.dataset.id);recalcMed(p);if(p.wantDonor!==false)p.donorOn=eligibility(p).fit;syncDonorList(p);
      state.view=null;state.tab='profile';render();const el=document.getElementById('journal');if(el)el.scrollIntoView({block:'start'});
      toast(eligibility(p).fit||p.wantDonor===false?'Запись удалена':`Запись удалена. Без действующих прививок ${p.name} пока не может быть донором`);break}
    case 'goWeight':{const el=document.getElementById('weight');if(el){el.scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>{const i=document.getElementById('w-new');i&&i.focus({preventScroll:true})},450)}break}
    case 'wDel':{const p=state.pet;if(p.weightLog.length>1){const at=+b.dataset.at;const x=p.weightLog.find(q=>q.at===at);delWeight(p,at);if(p.wantDonor!==false)p.donorOn=eligibility(p).fit;syncDonorList(p);render();toast(`Удалили запись ${x?kg(x.v)+' кг от '+fmt(x.d):''}. Текущий вес ${kg(p.weight)} кг`)}break}
    case 'editPet':if(state.pet){state.dform=petToForm(state.pet);go({type:'addDonor'})}break;
    case 'delPet':{const x=state.pets.find(q=>q.id===b.dataset.id);if(!x)break;readDForm();
      state.sheet={title:`Удалить ${x.name}?`,text:`Медкарта, история сдач и фото ${x.name} удалятся без возможности восстановления. Истории спасений в ленте останутся.`,
        actions:[{label:'Удалить',act:'delPetOk',danger:true,id:x.id},{label:'Отмена',act:'sheetClose'}]};render();break}
    case 'delPetOk':{const i=state.pets.findIndex(q=>q.id===b.dataset.id);if(i<0)break;const [x]=state.pets.splice(i,1);
      const j=DONORS.findIndex(d=>d.id==='d'+x.id);if(j>=0)DONORS.splice(j,1);
      state.pet=state.pets[0]||null;state.dform=emptyDForm();goTab('profile');toast(`${x.name} удалён(а) из профиля`);break}
    case 'goReady':{const el=document.getElementById('ready');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});break}
    case 'retrySos':state.view=null;state.tab='sos';submitSos();break;
    case 'copypost':{const r=state.requests.find(x=>x.id===b.dataset.id);copy((r.post||postTemplate(r))+'\nОткликнуться: https://krovinka.pet/r/'+r.id,'Текст со ссылкой скопирован');break}
    case 'home':goTab('home');break;
    case 'sos':goTab('sos');break;
    case 'back':state.view=null;state.anim=true;render();window.scrollTo(0,0);break;
    case 'cancelLogin':state.pending=null;if(state.tab==='profile')state.tab='home';state.view=null;render();break;
    case 'open':go({type:'req',id:b.dataset.id});break;
    case 'stories':go({type:'stories'});break;
    case 'city':go({type:'city'});break;
    case 'locate':locate();break;
    case 'setDistrict':state.locError=null;setLoc(DIST_C[b.dataset.d],b.dataset.d,'manual');render();toast(`Район: ${b.dataset.d}. Расстояния пересчитаны`);break;
    case 'notif':go({type:'notif'});break;
    case 'login':requireAuth(null,null);break;
    case 'goRewards':state.ptab='rewards';goTab('profile');break;
    case 'help':requireAuth('Чтобы откликнуться на запрос, войдите.',()=>doHelp(b.dataset.id));break;
    case 'addDonor':{const spc=b.dataset.sp;requireAuth('Чтобы добавить питомца, войдите.',()=>{state.dform=emptyDForm();if(spc)state.dform.species=spc;go({type:'addDonor'})});break}
    case 'share':{const r=state.requests.find(x=>x.id===b.dataset.id);copy('https://krovinka.pet/r/'+b.dataset.id,'Ссылка на запрос скопирована');
      if(state.user&&r&&!r.shared&&!r.mine){r.shared=true;bump('shares');bump('wkShares');addXP(10,'репост');checkProgress();render()}break}
    case 'set':{readForm();const k=b.dataset.k;state.form[k]=b.dataset.v;if(k==='species')state.form.group='не знаю';render();break}
    case 'dset':{readDForm();const k=b.dataset.k;state.dform[k]=b.dataset.v;if(k==='species')state.dform.group='не знаю';render();break}
    case 'choose':{const r=state.requests.find(x=>x.id===b.dataset.rid);r.respList.forEach(d=>d.chosen=d.id===b.dataset.did);
      r.trip={tok:Date.now(),donorId:b.dataset.did,st:0,eta:null};r.msgs=[];sysMsg(r,'Вы выбрали донора, он получил адрес клиники');r.waiting=false;tripSim(r);render();toast('Донор получил адрес клиники');break}
    case 'chat':go({type:'chat',id:b.dataset.id});setTimeout(()=>{const l=document.getElementById('chatlog');if(l)l.scrollTop=l.scrollHeight;const i=document.getElementById('m-text');i&&i.focus()},60);break;
    case 'quick':{const r=state.requests.find(x=>x.id===b.dataset.id);sendMsg(r,b.dataset.v);break}
    case 'noShow':{const r=state.requests.find(x=>x.id===b.dataset.id);const d=r.respList.find(x=>x.id===r.trip.donorId);
      state.sheet={title:`${d.name} не приедет?`,text:'Мы вернём запрос в поиск и сразу отправим следующую волну уведомлений. Донору придёт сообщение, что запрос снят с него.',actions:[{label:'Да, искать другого',act:'noShowOk',danger:true,id:r.id},{label:'Подождать ещё',act:'sheetClose'}]};render();break}
    case 'noShowOk':{const r=state.requests.find(x=>x.id===b.dataset.id);const d=r.respList.find(x=>x.id===r.trip.donorId);d.chosen=false;d.declined=true;r.trip=null;sysMsg(r,`${d.name} не сможет приехать, ищем другого донора`);
      const more=DONORS.filter(x=>x.species===r.species&&!r.respList.some(q=>q.id===x.id)).slice(0,2);r.waiting=more.length>0;r.notified+=more.length+4;
      more.forEach((x,i)=>setTimeout(()=>{r.respList.push({...x,owner:OWNERS[(i+5)%OWNERS.length],phone:'+7 000 000-00-2'+i,chosen:false});r.responders=r.respList.length;if(i===more.length-1)r.waiting=false;if(state.view&&state.view.id===r.id)render();toast(`${x.name} может приехать`)},2500+i*2500));
      render();toast('Запрос снова в поиске, уведомили ещё доноров');break}
    case 'confirmDon':{const r=state.requests.find(x=>x.id===b.dataset.id);const d=r.respList.find(x=>x.id===r.trip.donorId);
      state.sheet={title:`Подтвердить сдачу?`,text:`${d.name} сдал(а) кровь для ${r.pet} в клинике. Донор получит +150 капель и отметку о сдаче, следующий SOS придёт ему не раньше чем через ${r.species==='dog'?60:90} дней.`,actions:[{label:'Да, кровь взяли',act:'confirmDonOk',primary:true,id:r.id},{label:'Ещё нет',act:'sheetClose'}]};render();break}
    case 'confirmDonOk':{const r=state.requests.find(x=>x.id===b.dataset.id);const d=r.respList.find(x=>x.id===r.trip.donorId);r.trip.st=4;
      state.requests=state.requests.filter(x=>x.id!==r.id);state.sform={...emptySForm(),pet:r.pet,donor:d.name,fromReq:true};go({type:'storyNew'});toast(`Спасибо! ${d.name} получил(а) +150 капель. Расскажите, как всё прошло`);break}
    case 'closeAsk':{const r=state.requests.find(x=>x.id===b.dataset.id);
      state.sheet={title:'Закрыть запрос?',text:r.trip?'Донор уже в пути. Если он приехал и кровь взяли, лучше подтвердить сдачу на карточке донора.':'Доноры перестанут получать уведомления, ссылка на запрос покажет «Запрос закрыт».',
        actions:[{label:'Нашли донора в другом месте',act:'closeOk',primary:true,id:r.id},{label:'Помощь больше не нужна',act:'closeOk',id:r.id},{label:'Отмена',act:'sheetClose'}]};render();break}
    case 'closeOk':{state.requests=state.requests.filter(x=>x.id!==b.dataset.id);goTab('requests');toast('Запрос закрыт. Надеемся, всё хорошо');break}
    case 'unhelp':{const r=state.requests.find(x=>x.id===b.dataset.id);r.helped=false;r.helpTok=0;r.responders=Math.max(0,r.responders-1);render();toast('Отклик отменён, хозяин получил уведомление');break}
    case 'tripGo':{const r=state.requests.find(x=>x.id===b.dataset.id);r.picked.st=2;sysMsg(r,'Вы выехали');render();toast('Хозяин видит, что вы в пути');break}
    case 'tripHere':{const r=state.requests.find(x=>x.id===b.dataset.id);r.picked.st=3;sysMsg(r,'Вы на месте в клинике');render();toast('Хозяин получил уведомление, что вы на месте');
      const at=pickedSim(r);at(5000,()=>{r.picked.st=4;sysMsg(r,'Хозяин подтвердил сдачу');const p=state.pets.find(x=>x.id===r.picked.petId)||state.pet;state.pet=p;
        creditDonation(p,r.clinic);state.requests=state.requests.filter(x=>x.id!==r.id);toast(`${r.owner} подтвердил(а) сдачу. Спасибо!`);go({type:'celebrate'})});break}
    case 'cantCome':{const r=state.requests.find(x=>x.id===b.dataset.id);
      state.sheet={title:'Не сможете приехать?',text:'Хозяин сразу получит уведомление, запрос вернётся в поиск. Ничего страшного, так бывает. Чем раньше отмените, тем быстрее найдётся другой донор.',actions:[{label:'Да, отменить',act:'cantComeOk',danger:true,id:r.id},{label:'Я еду',act:'sheetClose'}]};render();break}
    case 'cantComeOk':{const r=state.requests.find(x=>x.id===b.dataset.id);r.picked=null;r.helped=false;r.helpTok=0;r.responders=Math.max(0,r.responders-1);render();toast('Хозяин получил уведомление, запрос снова в поиске');break}
    case 'settings':go({type:'settings'});break;
    case 'setRadius':state.notif.radius=+b.dataset.v;render();break;
    case 'tgOff':{if(!state.notif.push){toast('Сначала включите push, иначе SOS не дойдут');break}state.tgConnected=false;render();toast('Telegram отключён');break}
    case 'link':{const u=state.user;u.links=u.links||new Set([u.method]);if(isOffline()){toast('Нет соединения');break}u.links.add(b.dataset.k);if(b.dataset.k==='tg')state.tgConnected=true;render();toast('Способ входа привязан');break}
    case 'unlink':{const u=state.user;u.links=u.links||new Set([u.method]);if(u.links.size<=1){toast('Это единственный способ входа. Сначала привяжите другой');break}
      u.links.delete(b.dataset.k);if(u.method===b.dataset.k)u.method=[...u.links][0];render();toast('Способ входа отвязан');break}
    case 'exportData':toast('Запрос принят. Пришлём файл с вашими данными в Telegram или на почту');break;
    case 'delAcc':state.sheet={title:'Удалить аккаунт?',text:'Профиль, питомцы, медкарта, переписка и капли удалятся без возможности восстановления. Истории спасений останутся без вашего имени.',actions:[{label:'Удалить навсегда',act:'delAccOk',danger:true},{label:'Отмена',act:'sheetClose'}]};render();break;
    case 'delAccOk':{state.pets.forEach(x=>{const j=DONORS.findIndex(d=>d.id==='d'+x.id);if(j>=0)DONORS.splice(j,1)});
      state.user=null;state.pets=[];state.pet=null;state.xp=0;state.stats=freshStats();state.badgesSeen=new Set();state.chalDone=new Set();state.tgConnected=false;state.login={step:'choose',phone:'',code:'',name:'',consent:false};goTab('home');toast('Аккаунт и данные удалены');break}
    case 'copyphone':copy(b.dataset.phone,'Телефон скопирован');break;
    case 'route':toast('В рабочей версии откроется маршрут в Яндекс Картах');break;
    case 'close':{const r=state.requests.find(x=>x.id===b.dataset.id);const d=r&&r.respList&&r.respList.find(x=>x.chosen);state.requests=state.requests.filter(x=>x.id!==b.dataset.id);
      state.sform={...emptySForm(),pet:r?r.pet:'',donor:d?d.name:'',fromReq:true};go({type:'storyNew'});toast('Запрос закрыт. Расскажите, как всё прошло');break}
    case 'storyNew':requireAuth('Чтобы рассказать историю, войдите.',()=>{state.sform=emptySForm();go({type:'storyNew'})});break;
    case 'storyAI':storyAI();break;
    case 'thanks':{const s=state.stories[+b.dataset.i];s.on=!s.on;s.thanks+=s.on?1:-1;render();break}
    case 'medDone':{const p=state.pets.find(x=>x.id===b.dataset.pet);const m=p.med[+b.dataset.i];
      if(m.date&&+m.date===+today){toast('Уже отмечено сегодня');break}
      const ev=m.product?everyFor(m.k,m.product,p.species):MK[m.k].every;addJournal(p,jEntry(m.k,m.product,new Date(today),ev));render();
      toast(`Записали в журнал: ${m.product||MK[m.k].t}, сегодня`);bump('medMarks');bump('wkMed');addXP(5,'медкарта');checkProgress();render();break}
    case 'tg':requireAuth('Чтобы подключить Telegram, войдите.',()=>{if(!state.tgConnected){state.tgConnected=true;toast('Telegram подключён');addXP(15,'Telegram');checkProgress()}render()});break;
    case 'vote':{const c=state.cities[+b.dataset.i];c.voted=true;c.waiting++;render();toast(`Сообщим, когда Кровинка заработает: ${c.name}`);break}
    case 'petSel':state.pet=state.pets[+b.dataset.i];render();break;
    case 'ptab':state.ptab=b.dataset.k;render();break;
    case 'lbtab':state.lbtab=b.dataset.k;render();break;
    case 'donate':go({type:'donate'});break;
    case 'hero':{state.heroUrl=null;go({type:'hero'});const p=state.pet;makeHero(p).then(u=>{state.heroUrl=u;if(state.view&&state.view.type==='hero')render()});break}
    case 'heroText':{const p=state.pet;copy(`${p.name} — донор крови. Уже ${p.saved} ${plural(p.saved,'спасённая жизнь','спасённые жизни','спасённых жизней')}. Ваш питомец тоже может помочь: krovinka.pet`,'Текст скопирован');break}
    case 'invite':{copy('Мой питомец — донор крови в Кровинке. Присоединяйся: krovinka.pet/i/anna','Приглашение скопировано');
      if(state.stats.invites<3){setTimeout(()=>{const names=['Марина','Кирилл','Ольга'];toast(`${names[state.stats.invites]} зарегистрировала донора по вашей ссылке`);bump('invites');addXP(50,'приглашение');checkProgress();render()},3000)}break}
    case 'loginProv':{const k=b.dataset.p,v=PROV[k];state.login.err=null;if(!state.login.consent){fErr('l-consent','Чтобы войти, отметьте согласие на обработку данных');break}
      if(isOffline()){state.login.err=`Нет соединения. Войти через ${v.n} можно, когда появится интернет.`;render();break}
      state.sheet={title:`Вход через ${v.n}`,text:`Демо. В рабочей версии откроется страница ${v.who}: вы подтвердите, что Кровинка может получить ${v.data}. Пароль Кровинка не видит.`,
        actions:[{label:'Продолжить как Анна',act:'provOk',primary:true,id:k},{label:'Отмена',act:'provCancel',id:k}]};render();break}
    case 'provOk':state.login.err=null;finishLogin({name:'Анна',method:b.dataset.id,phone:'+7 911 ***-45-67'});break;
    case 'provCancel':state.login.err=`Вход через ${PROV[b.dataset.id].n} отменён. Попробуйте ещё раз или выберите другой способ.`;render();break;
    case 'loginTg':state.login.err=null;if(!state.login.consent){fErr('l-consent','Чтобы войти, отметьте согласие на обработку данных');break}if(isOffline()){toast('Нет соединения. Войти можно, когда появится интернет');break}state.tgConnected=true;finishLogin({name:'Анна',method:'tg'});break;
    case 'loginPhone':if(state.login.step==='choose'&&!state.login.consent){fErr('l-consent','Чтобы войти, отметьте согласие на обработку данных');break}state.login.step='phone';render();break;
    case 'loginBack':state.login.step='choose';render();break;
    case 'resend':state.login.resendAt=Date.now()+30000;state.login.lockUntil=0;state.login.tries=0;render();toast('Новый код отправлен');break;
    case 'logout':state.user=null;state.pets=[];state.pet=null;state.xp=0;state.stats=freshStats();state.badgesSeen=new Set();state.chalDone=new Set();state.tgConnected=false;state.login={step:'choose',phone:'',code:'',name:'',consent:false};goTab('home');toast('Вы вышли');break;
    case 'theme':{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';break}
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render()}});
state.anim=true;render();
</script>
