    case 'tripHere':{const r=state.requests.find(x=>x.id===b.dataset.id);r.picked.st=3;sysMsg(r,'Вы на месте в клинике');render();toast('Хозяин получил уведомление, что вы на месте');
      const at=pickedSim(r);at(5000,()=>{r.picked.st=4;sysMsg(r,'Хозяин подтвердил сдачу');const p=state.pets.find(x=>x.id===r.picked.petId)||state.pet;state.pet=p;
        creditDonation(p,r.clinic);state.requests=state.requests.filter(x=>x.id!==r.id);toast(`${r.owner} подтвердил(а) сдачу. Спасибо!`);go({type:'celebrate'})});break}
    case 'cantCome':{const r=state.requests.find(x=>x.id===b.dataset.id);
      state.sheet={title:'Не сможете приехать?',text:'Хозяин сразу получит уведомление, запрос вернётся в поиск. Ничего страшного, так бывает. Чем раньше отмените, тем быстрее найдётся другой донор.',actions:[{label:'Да, отменить',act:'cantComeOk',danger:true,id:r.id},{label:'Я еду',act:'sheetClose'}]};render();break}
    case 'cantComeOk':{const r=state.requests.find(x=>x.id===b.dataset.id);r.picked=null;r.helped=false;r.helpTok=0;r.responders=Math.max(0,r.responders-1);render();toast('Хозяин получил уведомление, запрос снова в поиске');break}
    case 'settings':go({type:'settings'});break;
    case 'setRadius':state.notif.radius=+b.dataset.v;render();break;
    case 'tgOff':{if(!state.notif.push){toast('Сначала включите push, иначе SOS не дойдут');break}state.tgConnected=false;render();toast('Telegram отключён');break}
    case 'link':{const u=state.user;u.links=u.links||new Set([u.method]);if(isOffline()){toast('Нет соединения');break}u.links.add(b.dataset.k);if(b.dataset.k==='tg')state.tgConnected=true;render();toast('Способ входа привязан');break}
    case 'unlink':{const u=state.user;u.links=u.links||new Set([u.method]);if(u.links.size<=1){toast('Это единственный способ входа. Сначала привяжите другой');break}
      u.links.delete(b.dataset.k);if(u.method===b.dataset.k)u.method=[...u.links][0];render();toast('Способ входа отвязан');break}
    case 'exportData':toast('Запрос принят. Пришлём файл с вашими данными в Telegram или на почту');break;
    case 'delAcc':state.sheet={title:'Удалить аккаунт?',text:'Профиль, питомцы, медкарта, переписка и капли удалятся без возможности восстановления. Истории спасений останутся без вашего имени.',actions:[{label:'Удалить навсегда',act:'delAccOk',danger:true},{label:'Отмена',act:'sheetClose'}]};render();break;
    case 'delAccOk':{state.pets.forEach(x=>{const j=DONORS.findIndex(d=>d.id==='d'+x.id);if(j>=0)DONORS.splice(j,1)});
      state.user=null;state.pets=[];state.pet=null;state.xp=0;state.stats=freshStats();state.badgesSeen=new Set();state.chalDone=new Set();state.tgConnected=false;state.login={step:'choose',phone:'',code:'',name:'',consent:false};goTab('home');toast('Аккаунт и данные удалены');break}
    case 'copyphone':copy(b.dataset.phone,'Телефон скопирован');break;
    case 'route':toast('В рабочей версии откроется маршрут в Яндекс Картах');break;
    case 'close':{const r=state.requests.find(x=>x.id===b.dataset.id);const d=r&&r.respList&&r.respList.find(x=>x.chosen);state.requests=state.requests.filter(x=>x.id!==b.dataset.id);
      state.sform={...emptySForm(),pet:r?r.pet:'',donor:d?d.name:'',fromReq:true};go({type:'storyNew'});toast('Запрос закрыт. Расскажите, как всё прошло');break}
    case 'storyNew':requireAuth('Чтобы рассказать историю, войдите.',()=>{state.sform=emptySForm();go({type:'storyNew'})});break;
    case 'storyAI':storyAI();break;
    case 'thanks':{const s=state.stories[+b.dataset.i];s.on=!s.on;s.thanks+=s.on?1:-1;render();break}
    case 'medDone':{const p=state.pets.find(x=>x.id===b.dataset.pet);const m=p.med[+b.dataset.i];
      if(m.date&&+m.date===+today){toast('Уже отмечено сегодня');break}
      const ev=m.product?everyFor(m.k,m.product,p.species):MK[m.k].every;addJournal(p,jEntry(m.k,m.product,new Date(today),ev));render();
      toast(`Записали в журнал: ${m.product||MK[m.k].t}, сегодня`);bump('medMarks');bump('wkMed');addXP(5,'медкарта');checkProgress();render();break}
    case 'tg':requireAuth('Чтобы подключить Telegram, войдите.',()=>{if(!state.tgConnected){state.tgConnected=true;toast('Telegram подключён');addXP(15,'Telegram');checkProgress()}render()});break;
    case 'perk':copy(b.dataset.code+'-'+String(state.user&&state.user.name||'').length+'7','Промокод скопирован. Покажите его партнёру');break;
    case 'cityAll':document.querySelectorAll('#city-list [data-more]').forEach(el=>el.hidden=false);b.remove();break;
    case 'phoneShow':{const r=state.requests.find(x=>x.id===b.dataset.id);const P=r.ph||(r.ph={me:false,them:false});P.me=true;sysMsg(r,'Вы открыли свой номер');render();
      const other=r.mine?r.respList.find(x=>x.id===r.trip.donorId).owner:r.owner;toast(`Ваш номер виден: ${other}`);
      if(!P.them)setTimeout(()=>{P.them=true;sysMsg(r,`${other} открыл(а) свой номер`);if(state.view&&state.view.id===r.id)render();toast(`${other} тоже открыл(а) номер`)},3000);break}
    case 'phoneHide':{const r=state.requests.find(x=>x.id===b.dataset.id);r.ph.me=false;render();toast('Номер скрыт. Если его уже записали, это не отменить');break}
    case 'report':{const id=b.dataset.id;const R=[['money','Просят деньги или данные карты'],['photo','Неподходящее фото'],['fake','Похоже на фейковый запрос'],['sell','Продажа или покупка крови'],['rude','Грубость или угрозы'],['other','Другое']];
      if(b.dataset.sp){reportDo(id,b.dataset.sp);break}
      state.sheet={title:'Что случилось?',text:'Жалобу проверит модератор в течение часа. Тот, на кого вы жалуетесь, не узнает, кто её отправил.',actions:[...R.map(([k,l])=>({label:l,act:'reportDo',id,sp:k})),{label:'Отмена',act:'sheetClose'}]};render();break}
    case 'reportDo':reportDo(b.dataset.id,b.dataset.sp);break;
    case 'support':go({type:'support'});break;
    case 'supTopic':{const t=document.getElementById('sup-text');const v=t?t.value:'';state.supTopic=b.dataset.k;render();const t2=document.getElementById('sup-text');if(t2)t2.value=v;break}
    case 'legal':ev.preventDefault();if(state.view&&state.view.type==='legal'){state.view.k=b.dataset.k;render();window.scrollTo(0,0)}else go({type:'legal',k:b.dataset.k});break;
    case 'openClinic':go({type:'clinic'});break;
    case 'openTg':go({type:'tgv'});setTimeout(()=>{const l=document.getElementById('tglog');if(l)l.scrollTop=l.scrollHeight},30);break;
    case 'openPub':{const r=state.requests.find(x=>!x.reported)||state.requests[0];if(r)go({type:'pub',id:r.id});break}
    case 'pub':go({type:'pub',id:b.dataset.id});break;
    case 'pubHelp':{const id=b.dataset.id;requireAuth('Войдите, чтобы откликнуться. Через Telegram — одно нажатие.',()=>{go({type:'req',id});doHelp(id)});break}
    case 'timeSkip':{const mine=state.requests.filter(r=>r.mine);if(!mine.length){toast('Сначала создайте SOS-запрос');break}mine.forEach(r=>r.created=(r.created||Date.now())-25*3600e3);render();toast('Прошли сутки. Павхелп спросит, актуален ли запрос');break}
    case 'renew':{const r=state.requests.find(x=>x.id===b.dataset.id);r.created=Date.now();r.renewed=(r.renewed||0)+1;render();toast('Продлили на сутки и напомнили донорам рядом');break}
    case 'cSel':state.clinicId=b.dataset.id;render();break;
    case 'cTab':state.ctab=b.dataset.k;render();break;
    case 'cOk':{const r=state.requests.find(x=>x.id===b.dataset.id);r.verified=true;sysMsg(r,'Клиника подтвердила запрос');render();toast('Запрос подтверждён. Доноры видят отметку');break}
    case 'cNo':{const r=state.requests.find(x=>x.id===b.dataset.id);r.rejected=true;r.reported='fake';render();toast('Отправили модератору. Запрос скрыт из ленты');break}
    case 'cDon':case 'cDonNo':{const id=b.dataset.id,ok=a==='cDon';const p=state.pets.find(x=>x.id===id);
      if(p){if(ok){const cl=p.pending.clinic,ld=p.pending.date;creditDonation(p,cl);p.lastDonation=ld;toast(`Сдача ${p.name} подтверждена. Донору начислены капли`)}else{p.pending=null;p.lastDonation=null;if(p.wantDonor!==false)p.donorOn=eligibility(p).fit;syncDonorList(p);toast('Отметили, что сдачи не было. Хозяин получит уведомление')}}
      else{const x=DEMO_PENDING.find(q=>q.id===id);if(x){x.done=true;toast(ok?`Сдача ${x.pet} подтверждена`:'Отметили, что сдачи не было')}}render();break}
    case 'cStock':{const c=clinic(state.clinicId),i=+b.dataset.i;c.stock[i][3]=Math.max(0,c.stock[i][3]+ +b.dataset.d);if(!c.stock[i][3])c.stock.splice(i,1);c.upd=0;c.bank=c.stock.length>0;render();break}
    case 'cAdd':{const c=clinic(state.clinicId),g=id=>document.getElementById(id).value;const spv=g('cs-sp'),grp=g('cs-g');
      if((spv==='dog'&&!grp.startsWith('DEA'))||(spv==='cat'&&grp.startsWith('DEA'))){fErr('cs-g',spv==='dog'?'У собак группы DEA 1.1+ и DEA 1.1−':'У кошек группы A, B и AB');break}
      const ml=parseInt(g('cs-ml'))||0;if(!ml){fErr('cs-ml','Укажите объём дозы');break}
      const ex=c.stock.find(s=>s[0]===spv&&s[1]===grp&&s[2]===g('cs-c')&&s[4]===ml);if(ex)ex[3]++;else c.stock.push([spv,grp,g('cs-c'),1,ml]);c.upd=0;c.bank=true;render();toast('Добавили в банк крови');break}
    case 'tgHelp':{const r=state.requests.find(x=>x.id===b.dataset.id);state.tgLog.push({me:true,t:'Могу помочь'});
      const can=state.user&&state.pets.some(p=>p.species===r.species&&p.donorOn&&!isPaused(p)&&eligibility(p).ready);
      if(can&&!r.helped){doHelp(r.id);state.view={type:'tgv'};state.sheet=null}
      state.tgLog.push({bot:true,t:can?`Отклик отправлен. ${r.owner} выберет донора и пришлёт адрес. Я напишу сюда.`:`Похоже, сейчас никто из ваших питомцев не может помочь ${r.pet}. Можно переслать запрос знакомым: pavhelp.ru/r/${r.id}`});render();break}
    case 'tgSkip':{const r=state.requests.find(x=>x.id===b.dataset.id);state.tgLog.push({me:true,t:'Не сейчас'},{bot:true,t:`Хорошо, больше не напомню про ${r.pet}. Спасибо, что откликаетесь на SOS.`});render();break}
    case 'pause':{const p=state.pet;p.pauseUntil=Date.now()+(+b.dataset.d)*DAY;syncDonorList(p);render();toast(`Пауза до ${fmt(new Date(p.pauseUntil))}. SOS не будут приходить`);break}
    case 'unpause':{const p=state.pet;p.pauseUntil=null;syncDonorList(p);render();toast(`${p.name} снова получает SOS`);break}
    case 'unpauseHelp':{state.pets.forEach(p=>{if(isPaused(p))p.pauseUntil=null;syncDonorList(p)});doHelp(b.dataset.id);break}
    case 'iosHide':state.iosHide=true;render();break;
    case 'iosHow':state.sheet={title:'Павхелп на экране «Домой»',text:IOS_STEPS,actions:[{label:'Понятно',act:'sheetClose',primary:true}]};render();break;
    case 'onb':{state.pet=state.pets.find(x=>x.id===b.dataset.id)||state.pet;go({type:'onb'});break}
    case 'onbPush':{state.pet.onb.notif=true;state.notif.push=true;render();toast('Push включены. Telegram можно подключить позже');break}
    case 'onbGroup':state.pet.onb.group=true;render();break;
    case 'onbDone':state.view=null;state.tab='profile';state.ptab='pets';state.anim=true;render();window.scrollTo(0,0);break;

    case 'widen':{const r=state.requests.find(x=>x.id===b.dataset.id);if(r.radius>=50)break;r.radius=50;
      const more=matchDonors({species:r.species,group:r.group,radius:50}).filter(d=>!r._m.some(x=>x.id===d.id));
      r.notified+=more.length;render();toast(more.length?`Уведомили ещё ${more.length} ${plural(more.length,'донора','доноров','доноров')} в 50 км`:'В 50 км подходящих доноров тоже пока нет. Позвоните в клинику и разошлите текст в чаты');
      if(more.length){r.waiting=true;dispatch(r,more)}break}
    case 'setCity':{const n=b.dataset.c;state.locError=null;chooseCity(n,'manual');render();window.scrollTo(0,0);toast(`${n}: показываем доноров, клиники и запросы рядом`);break}
    case 'petSel':state.pet=state.pets[+b.dataset.i];render();break;
    case 'ptab':state.ptab=b.dataset.k;render();break;
    case 'lbtab':state.lbtab=b.dataset.k;render();break;
    case 'donate':go({type:'donate'});break;
    case 'hero':{state.heroUrl=null;go({type:'hero'});const p=state.pet;makeHero(p).then(u=>{state.heroUrl=u;if(state.view&&state.view.type==='hero')render()});break}
    case 'heroText':{const p=state.pet;copy(`${p.name} — донор крови. Уже ${p.saved} ${plural(p.saved,'спасённая жизнь','спасённые жизни','спасённых жизней')}. Ваш питомец тоже может помочь: pavhelp.ru`,'Текст скопирован');break}
    case 'invite':{copy('Мой питомец — донор крови в Павхелпе. Присоединяйся: pavhelp.ru/i/anna','Приглашение скопировано');
      if(state.stats.invites<3){setTimeout(()=>{const names=['Марина','Кирилл','Ольга'];toast(`${names[state.stats.invites]} зарегистрировала донора по вашей ссылке`);bump('invites');addXP(50,'приглашение');checkProgress();render()},3000)}break}
    case 'loginProv':{const k=b.dataset.p,v=PROV[k];state.login.err=null;if(!state.login.consent){fErr('l-consent','Чтобы войти, отметьте согласие на обработку данных');break}
      if(isOffline()){state.login.err=`Нет соединения. Войти через ${v.n} можно, когда появится интернет.`;render();break}
      state.sheet={title:`Вход через ${v.n}`,text:`Демо. В рабочей версии откроется страница ${v.who}: вы подтвердите, что Павхелп может получить ${v.data}. Пароль Павхелп не видит.`,
        actions:[{label:'Продолжить как Анна',act:'provOk',primary:true,id:k},{label:'Отмена',act:'provCancel',id:k}]};render();break}
    case 'provOk':state.login.err=null;finishLogin({name:'Анна',method:b.dataset.id});break;
    case 'provCancel':state.login.err=`Вход через ${PROV[b.dataset.id].n} отменён. Попробуйте ещё раз или выберите другой способ.`;render();break;
    case 'loginTg':state.login.err=null;if(!state.login.consent){fErr('l-consent','Чтобы войти, отметьте согласие на обработку данных');break}if(isOffline()){toast('Нет соединения. Войти можно, когда появится интернет');break}state.tgConnected=true;finishLogin({name:'Анна',method:'tg'});break;
    case 'loginEmail':if(state.login.step==='choose'&&!state.login.consent){fErr('l-consent','Чтобы войти, отметьте согласие на обработку данных');break}state.login.step='email';render();setTimeout(()=>{const i=document.getElementById('l-email');i&&i.focus()},50);break;
    case 'loginBack':state.login.step='choose';render();break;
    case 'resend':state.login.resendAt=Date.now()+60000;state.login.lockUntil=0;state.login.tries=0;render();toast('Новое письмо с кодом отправлено');break;
    case 'logout':state.user=null;state.pets=[];state.pet=null;state.xp=0;state.stats=freshStats();state.badgesSeen=new Set();state.chalDone=new Set();state.tgConnected=false;state.login={step:'choose',phone:'',code:'',name:'',consent:false};goTab('home');toast('Вы вышли');break;
    case 'theme':{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';break}
  }
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render()}});
state.anim=true;render();
</script>
