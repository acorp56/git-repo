# База для разработки: PostgreSQL 16 с PostGIS.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: pavhelp
      POSTGRES_PASSWORD: pavhelp
      POSTGRES_DB: pavhelp
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  db:
